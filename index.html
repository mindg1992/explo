     <p class="hint">f 는 실내 평균 배경농도를 배기구측 농도로 나눈 값입니다 — <b>1</b>(균일), <b>1.5</b>(일부 비균질), <b>5</b>(많이 비균질).
      Q<sub>a</sub> 는 초당 값입니다. ${(+s.배경Qa>0)?`입력값 ${num(+s.배경Qa,4)} m³/s = <b>${num(+s.배경Qa*3600,4)} m³/h</b>.`:"m³/h 로 알고 있다면 3600 으로 나눠 넣으세요."}</p>
     <p class="hint">${r.배경ok
        ? `X<sub>b</sub> = <b>${volTxt(r.Xb)}</b>, 임계농도 = <b>${volTxt(r.Xcrit)}</b> (LFL의 25 %) → ${r.Xb초과
            ? `<b style="color:var(--red)">임계농도 초과 → 희석등급 저희석 확정</b> (차트 판독 불필요)`
            : `임계농도 이하 → 차트로 희석등급 판정`}`
        : `공기 유량 Q<sub>a</sub> 를 입력하면 배경농도를 계산합니다. 임계농도 = <b>${volTxt(r.Xcrit)}</b> (LFL의 25 %).`}</p>`:""}
   <label class="f"><span>배경농도 판단근거 <em>(자동 작성된 문장을 고쳐 쓰세요)</em></span><textarea
    data-path="src.배경근거" data-auto="1" rows="3">${esc(s.배경근거||bgAuto(s))}</textarea></label>
   <div style="margin-top:6px"><button class="mini" data-act="bgclr">자동문구로 되돌리기</button></div>
   <p class="hint" id="bgHint">${bgHint(s)}</p>
   ${Sel("희석등급 판정","src.희석모드",["auto","manual"]).replace(">auto<",">차트 자동판정<").replace(">manual<",">수동 지정<")}
   ${s.희석모드==="manual"?`${Sel("적용 희석등급","src.희석수동",["고희석","중희석","저희석"])}${F("사유(예: 설비특성상)","src.희석근거")}`:""}
  </fieldset>`;

  h+=`<fieldset><legend>⑥ 범위(거리) 산정</legend>
   ${Sel("누출형태 (범위곡선)","src.누출형태",["무거운가스","저속확산","고속제트"])}
   ${Sel("범위 적용","src.범위모드",["auto","manual"]).replace(">auto<",">차트 자동판독<").replace(">manual<",">직접 지정<")}
   ${s.범위모드==="manual"?F("적용 범위(m)","src.범위수동","number"):`<p class="hint">차트 판독값 : ${m1(r.범위)} m</p>`}
   <div class="row">${F("도면 수평범위(m)","src.수평","number",'placeholder="비우면 자동"')}${F("도면 수직범위(m)","src.수직","number",'placeholder="비우면 자동"')}</div>
   <p class="hint">비워두면 산정된 범위(${m1(r.범위)} m)를 그대로 씁니다. 도면에 다른 값을 반영할 때만 입력하세요.</p>
  </fieldset>`;

  /* ⑦ 마지막 요약표의 "※ 폭발위험지역의 추정" 칸.
     칸에는 자동 작성된 문구가 이미 들어가 있고, 거기서 고쳐 쓰는 방식이다.
     손대기 전까지는 계산이 바뀔 때마다 따라 바뀌고, 고치는 순간 그 문구로 굳는다. */
  h+=`<fieldset><legend>⑦ ※ 폭발위험지역의 추정 문구</legend>
   <label class="f"><span>문구 <em>(자동 작성된 문장을 고쳐 쓰세요)</em></span><textarea
    data-path="src.추정문구" data-auto="1" rows="4">${esc(s.추정문구||estAuto(s,r))}</textarea></label>
   <div style="margin-top:6px"><button class="mini" data-act="estclr">자동문구로 되돌리기</button></div>
   <p class="hint" id="estHint">${estHint(s)}</p>
  </fieldset>`;
  $("#pane-src").innerHTML=h;
}

/* ===================== 이벤트 ===================== */
document.addEventListener("input",e=>{
  const el=e.target, p=el.dataset.path; if(!p)return;
  let v=el.value;
  if(el.type==="number")v=v===""?"":parseFloat(v);
  if(el.dataset.type==="bool")v=(v==="true");
  setPath(p,v);
  /* 유형을 바꾸면 그 유형에 맞는 압력 기본값을 깔아 준다. 잠그는 게 아니라 되돌려 주는 것이라
     상압탱크로 바꾼 뒤에도 단위를 다시 골라 압력을 넣을 수 있다. */
  if(p==="src.srcType"||p==="src.상"){
    const s=S.srcs[S.selSrc];
    if(s){
      if(p==="src.상"){                       // 상을 바꾸면 그 상의 첫 유형으로 옮긴다
        const list=typesOf(v);
        if(list.indexOf(s.srcType)<0)s.srcType=list[0];
      }
      if(tyOf(s).atm){s.PopUnit="상압";s.Pop=""}
    }
  }
  if(el.tagName==="SELECT"||el.dataset.live){
    if(p.startsWith("doc."))renderDocPane(); else {renderSrcPane();renderMatPane()}
  }
  if(/^doc\.여백/.test(p))applyPageStyle();
  renderReport();
  if(el.tagName!=="SELECT"&&!el.dataset.live){syncSide()}
});
function syncSide(){
  const s=S.srcs[S.selSrc];if(!s)return;
  const m=matOf(s),r=calcSrc(s,m);
  /* 숫자칸 입력으로는 패널을 다시 그리지 않으므로 해설 상자를 여기서 직접 갱신한다 */
  const ph=$("#popHintBox"); if(ph)ph.innerHTML=popHintHtml(s,m,r);
  const dh=$("#dpHintBox");
  if(dh){
    dh.innerHTML = r.mode==="flash"
      ? `<p class="hint">ΔP = ${(r.dPshow||0).toLocaleString()} Pa → W = <b>${num(r.W,4)} kg/s</b> → W<sub>g</sub> = W × F<sub>v</sub> = <b>${num(r.Wg,3)} kg/s</b></p>`
      : dpHintHtml(s,r);
  }
  /* 아직 직접 손대지 않은 추정문구는 계산이 바뀌면 따라 바뀐다.
     지금 그 칸에 커서가 있으면 쓰던 글이 지워지므로 건드리지 않는다. */
  const et=$('#pane-src textarea[data-path="src.추정문구"]');
  if(et&&!String(s.추정문구||"").trim()&&document.activeElement!==et)et.value=estAuto(s,r);
  const eh=$("#estHint"); if(eh)eh.textContent=estHint(s);
  const bt=$('#pane-src textarea[data-path="src.배경근거"]');
  if(bt&&!String(s.배경근거||"").trim()&&document.activeElement!==bt)bt.value=bgAuto(s);
  const bh=$("#bgHint"); if(bh)bh.textContent=bgHint(s);
  const box=$("#pane-src .readout");
  if(box){const tmp=document.createElement("div");
    tmp.innerHTML=`<div class="readout">${box.innerHTML}</div>`;}
  // 결과 박스만 갱신
  const pane=$("#pane-src");
  const old=pane.querySelector(".readout");
  if(old){
    old.innerHTML=`<h4>계산 결과</h4><dl>
     ${r.mode==="liquid"?`<dt>액체 누출률 W</dt><dd>${num(r.W,4)} kg/s</dd><dt>풀 표면적 Ap</dt><dd>${num(r.Ap,4)} m²</dd>`
      :r.mode==="flash"?`<dt>액체 누출률 W</dt><dd>${num(r.W,4)} kg/s</dd><dt>가스 누출률 Wg</dt><dd>${num(r.Wg,3)} kg/s</dd>`
      :r.mode==="given"?`<dt>누출률 Wg <em>(제조사)</em></dt><dd>${num(r.Wg,3)} kg/s</dd>`
      :`<dt>임계압력 Pc</dt><dd>${num(r.Pc,4)} Pa</dd><dt>가스 누출률 Wg</dt><dd>${num(r.Wg,3)} kg/s</dd>`}
     <dt>부피증발률 Qg</dt><dd>${num(r.Qg,3)} m³/s</dd>
     <dt><b>누출특성</b></dt><dd><b>${num(r.C,3)} m³/s</b></dd>
     <dt>희석등급 (차트)</dt><dd>${r.희석auto}${s.희석모드!=="auto"?` → <b>${r.희석}</b>`:""}</dd>
     <dt>폭발위험장소</dt><dd><span class="tag ${zoneClass(r.zone)}">${r.zone}</span></dd>
     <dt>범위(차트) r</dt><dd>${num(r.rShow,4)} m → ${m1(r.범위)} m</dd></dl>
     ${r.msg.map(x=>`<div class="warn">${x}</div>`).join("")}`;
  }
}
document.addEventListener("change",e=>{
  const a=e.target.dataset.act;
  if(a==="preset"){const k=e.target.value;if(!k)return;
    const b=MAT_LIB[k];const m=S.mats[S.selMat];
    Object.assign(m,{명칭:k,식:b.식,M:b.M,rho:b.rho,비중:b.비중,gamma:b.gamma,인화점:b.인화점,발화점:b.발화점,비점:b.비점,Pv:b.Pv,LFL:b.LFL,그룹:b.그룹,온도:b.온도,CAS:b.CAS});
    renderPanes();}
  if(a==="setmat"){S.srcs[S.selSrc].matId=e.target.value;renderSrcPane();renderReport();}
  if(a==="tsel2"){const v=e.target.value;if(v===""){renderSrcPane();return}
    S.srcs[S.selSrc].t=+v;renderSrcPane();renderReport();}
});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b)return;
  const a=b.dataset.act, v=b.dataset.v;
  const s=S.srcs[S.selSrc];
  switch(a){
    case"selmat":S.selMat=+v;renderMatPane();break;
    case"addmat":S.mats.push(newMat("톨루엔"));S.selMat=S.mats.length-1;renderPanes();break;
    case"delmat":if(S.mats.length<2){alert("물질은 최소 1개 필요합니다.");break}
      {const id=S.mats[S.selMat].id;S.mats.splice(S.selMat,1);S.selMat=0;
       S.srcs.forEach(x=>{if(x.matId===id)x.matId=S.mats[0].id});renderPanes();}break;
    case"selsrc":S.selSrc=+v;renderSrcPane();break;
    case"addsrc":{const n=newSrc();n.matId=S.mats[0].id;n.설비명="신규-"+(S.srcs.length+1);S.srcs.push(n);S.selSrc=S.srcs.length-1;renderPanes();}break;
    case"copysrc":{const n=JSON.parse(JSON.stringify(s));n.id=uid();n.설비명=s.설비명+" (사본)";S.srcs.splice(S.selSrc+1,0,n);S.selSrc++;renderPanes();}break;
    case"delsrc":if(S.srcs.length<2){alert("누출원은 최소 1개 필요합니다.");break}
      S.srcs.splice(S.selSrc,1);S.selSrc=0;renderPanes();break;
    case"brk":{
      const k=b.dataset.k;
      if(!Array.isArray(S.doc.breaks))S.doc.breaks=[];
      const i=S.doc.breaks.indexOf(k);
      if(i<0)S.doc.breaks.push(k); else S.doc.breaks.splice(i,1);
      renderDocPane();renderReport();}break;
    case"spc":{const k=b.dataset.k, d=+b.dataset.d||1;
      const sp=S.doc.spacers||(S.doc.spacers={});
      const nv=Math.max(SPACE_MIN,Math.min(SPACE_MAX,(+sp[k]||0)+d));
      if(nv)sp[k]=nv; else delete sp[k];
      renderDocPane();renderReport();}break;
    case"clrspc":S.doc.spacers={};renderDocPane();renderReport();break;
    case"pgset":S.selPageKey=b.dataset.k;openTab("doc");renderDocPane();renderReport();break;
    case"pgnone":S.selPageKey=null;renderDocPane();renderReport();break;
    case"pgclr":{const ps=S.doc.pageset||{};delete ps[S.selPageKey];renderDocPane();renderReport();}break;
    case"clrpg":S.doc.pageset={};S.selPageKey=null;renderDocPane();renderReport();break;
    case"clrbrk":S.doc.breaks=[];renderDocPane();renderReport();break;
    case"lay":{const p=String(v).split(",").map(Number);
      S.doc.쪽번호자리=p[0];S.doc.여유=p[1];S.doc.블록간격=p[2];S.doc.표여백=p[3];S.doc.줄간격=p[4];
      renderDocPane();renderReport();}break;
    case"mg":{const p=String(v).split(",").map(Number);
      S.doc.여백상=p[0];S.doc.여백하=p[1];S.doc.여백좌=p[2];S.doc.여백우=p[3];
      renderDocPane();renderReport();}break;
    case"rel":s.등급=v;
      if(v!=="연속"&&s.poolMode==="tank")s.poolMode="spill";   // 탱크 액표면은 연속 전용
      renderSrcPane();renderReport();break;
    case"hole":s.S=+v;s.Scell=b.dataset.cell||"";renderSrcPane();renderReport();break;
    case"cd":s.Cd=+v;s.Cd근거=(CD_ROWS.find(x=>+x[2]===+v)||["",""])[0];renderSrcPane();renderReport();break;
    case"k":s.k=+v;s.k근거=K_ROWS.find(r=>+r[2]===+v)[1];renderSrcPane();renderReport();break;
    case"tsel":s.t=+v;renderSrcPane();renderReport();break;
    case"estclr":s.추정문구="";renderSrcPane();renderReport();break;
    case"bgclr":s.배경근거="";renderSrcPane();renderReport();break;
    case"uw":s.uw=+v;s.uwcell=b.dataset.cell||"";s.uw옥내=!b.dataset.cell;
      s.uw근거 = (+v===0.05)?"옥내의 경우 최소 공기속도 0.05 m/s 가정(<표 1> 비고)":"<표 1> 옥외 환기속도 적용";
      renderSrcPane();renderReport();break;
  }
});
document.querySelectorAll(".tabs button").forEach(btn=>btn.addEventListener("click",()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));btn.classList.add("on");
  document.querySelectorAll(".tabpane").forEach(x=>x.classList.remove("on"));
  $("#pane-"+btn.dataset.tab).classList.add("on");
}));
$("#btnPdf").addEventListener("click",()=>{
  document.title=`방폭계산서_${S.doc.회사}_${new Date().toISOString().slice(0,10)}`;
  buildReport();          // 대기 중인 재계산이 있어도 최신 상태로 인쇄되게 한다
  window.print();
});
$("#btnSave").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`방폭계산서_${S.doc.회사}.json`;a.click();URL.revokeObjectURL(a.href);
});
$("#btnLoad").addEventListener("click",()=>$("#fileIn").click());
$("#fileIn").addEventListener("change",ev=>{
  const f=ev.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{const o=JSON.parse(rd.result);
    Object.assign(S,{doc:o.doc,mats:o.mats,srcs:o.srcs,selMat:0,selSrc:0,selPageKey:null});
    fillDocDefaults(S.doc);S.srcs.forEach(fillSrcDefaults);renderPanes();
  }catch(err){alert("파일을 읽을 수 없습니다: "+err.message)}};
  rd.readAsText(f);
});

applyPageStyle();
renderPanes();
</script>
