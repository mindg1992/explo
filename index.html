:root{
  --ink:#131b24; --ink-2:#41505f; --ink-3:#75838f;
  --field:#ffffff; --panel:#f4f6f8; --deck:#dfe4e9; --rule:#c6cfd7; --rule-2:#e4e9ee;
  --blue:#14508c; --blue-soft:#e7eef6;
  --mark:#f5761a; --mark-soft:#fdecdd;
  --red:#c0392b; --green:#2f7d32;
  --z0:#d84315; --z1:#ef8b1e; --z2:#f2cf3c;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ui:"Pretendard","Malgun Gothic","맑은 고딕",-apple-system,"Segoe UI",sans-serif;
  --doc:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;
  /* 수식 — 기존 계산서(HWP 수식편집기)와 같은 Computer Modern 계열.
     한글은 CMU Serif 에 없으므로 자동으로 --doc 글꼴로 넘어간다. */
  --eq:"CMU Serif","Latin Modern Roman","CMU Serif Roman","Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--ui);color:var(--ink);background:var(--deck);font-size:13px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- app shell ---------- */
.app{display:flex;flex-direction:column;height:100vh}
.bar{display:flex;align-items:center;gap:14px;padding:0 16px;height:52px;background:var(--ink);color:#fff;flex:0 0 auto}
.bar h1{margin:0;font-size:14px;font-weight:700;letter-spacing:-.01em}
.bar .std{font-family:var(--mono);font-size:10.5px;color:#9fb2c4;letter-spacing:.02em}
.bar .sp{flex:1}
.bar button{background:#2b3a49;border:1px solid #3d4f61;color:#e8eef4;padding:6px 12px;border-radius:5px;cursor:pointer}
.bar button:hover{background:#3b4d5f}
.bar button.go{background:var(--mark);border-color:var(--mark);color:#241000;font-weight:700}
.bar button.go:hover{background:#ff8b34}

.work{flex:1;display:grid;grid-template-columns:minmax(400px,470px) 1fr;overflow:hidden}
.side{background:var(--panel);border-right:1px solid var(--rule);overflow-y:auto;padding:0 0 60px}
.stage{overflow-y:auto;padding:22px 0 60px;background:var(--deck)}

/* ---------- side panel ---------- */
.tabs{display:flex;position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--rule)}
.tabs button{flex:1;padding:11px 4px;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;color:var(--ink-2);font-weight:600}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue);background:#fff}
.tabpane{display:none;padding:14px}
.tabpane.on{display:block}

fieldset{border:1px solid var(--rule);border-radius:7px;margin:0 0 14px;padding:10px 12px 12px;background:#fff}
legend{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--blue);padding:0 6px;text-transform:uppercase}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.row.r3{grid-template-columns:repeat(3,1fr)}
.row.r1{grid-template-columns:1fr}
label.f{display:block;margin-bottom:8px}
label.f>span{display:block;font-size:11px;color:var(--ink-2);margin-bottom:3px;font-weight:600}
label.f>span em{font-style:normal;color:var(--ink-3);font-weight:400}
input[type=text],input[type=number],select,textarea{width:100%;padding:6px 8px;border:1px solid var(--rule);border-radius:5px;background:var(--field)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
input[type=number]{font-family:var(--mono)}
textarea{resize:vertical;min-height:52px}
.hint{font-size:11px;color:var(--ink-3);margin:2px 0 8px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{padding:5px 10px;border:1px solid var(--rule);background:#fff;border-radius:20px;cursor:pointer;font-size:12px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.chip.add{border-style:dashed;color:var(--blue);font-weight:700}
.mini{padding:4px 9px;font-size:11.5px;border:1px solid var(--rule);background:#fff;border-radius:5px;cursor:pointer}
.mini:hover{background:var(--blue-soft);border-color:var(--blue)}
.mini.danger{color:var(--red);border-color:#e3b3ae}
.mini.danger:hover{background:#fbeceb}

/* pick tables */
table.pick{width:100%;border-collapse:collapse;font-size:11px;margin:2px 0 4px}
table.pick th,table.pick td{border:1px solid var(--rule);padding:4px 5px;text-align:center;vertical-align:middle}
table.pick th{background:var(--blue-soft);font-weight:700;font-size:10.5px;color:#0e3a67}
table.pick td.lab{text-align:left;background:#fafbfc;font-weight:600}
table.pick td.hit{cursor:pointer;font-family:var(--mono)}
table.pick td.hit:hover{background:var(--mark-soft)}
table.pick td.on{background:var(--mark);color:#241000;font-weight:700}
table.pick tr.on td{background:var(--mark-soft)}

.readout{border:1px solid var(--rule);border-radius:7px;background:#fff;padding:10px 12px;margin-bottom:14px}
.readout h4{margin:0 0 8px;font-size:11px;letter-spacing:.04em;color:var(--blue);text-transform:uppercase}
.readout dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:12px}
.readout dt{color:var(--ink-2)}

.tag.z0{background:var(--z0);color:#fff}.tag.z1{background:var(--z1);color:#231400}
.tag.z2{background:var(--z2);color:#241f00}.tag.zn{background:#5d6b78;color:#fff}
.warn{border-left:3px solid var(--mark);background:#fff8f1;padding:7px 10px;font-size:11.5px;margin:8px 0;border-radius:0 5px 5px 0}

/* ---------- report ---------- */
#report{width:210mm;margin:0 auto}
.page{width:210mm;min-height:297mm;background:#fff;margin:0 auto 14px;box-shadow:0 2px 14px rgba(20,30,40,.18);font-family:var(--doc);color:#000;font-size:10.5pt;line-height:1.6;position:relative}
.page .pno{position:absolute;text-align:center;font-size:8.5pt;color:#555;font-family:var(--mono)}

/* 블록 = 페이지에 채워 넣는 최소 단위 */
.blk{display:flow-root;position:relative}
.blk+.blk{margin-top:6mm}
/* 줄(요소) 하나 = 페이지 나눔을 지정할 수 있는 최소 단위 */
.it{position:relative}
.it.brk:not(.top)::before{content:"";position:absolute;left:0;right:0;top:-1mm;border-top:2px dashed var(--mark)}
/* 버튼을 가로로 눕혀 컨트롤 높이를 한 줄로 줄인다. 세로로 쌓으면 짧은 줄에서
   컨트롤이 아래 줄까지 내려와 옆줄의 ✂ 를 잘못 누르게 된다.
   컨트롤은 줄 상자 밖(오른쪽 여백)에 있으므로 자기 자신에 마우스가 올라가도
   계속 보여야 한다. 줄 오른쪽 끝에 딱 붙여 중간에 끊기는 구간을 없앤다. */
.itctl{position:absolute;top:50%;transform:translateY(-50%);right:-15mm;
  opacity:0;transition:opacity .12s;display:flex;gap:2px;z-index:1}
.spc{pointer-events:none}
.it:hover>.itctl,.itctl:hover{opacity:1;z-index:6}
.itctl button{width:17px;height:17px;padding:0;border:1px solid var(--rule);background:#fff;border-radius:4px;
  cursor:pointer;font-size:10px;line-height:1;color:var(--ink-2);font-family:var(--ui)}
.itctl button:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.itctl button.on{background:var(--mark);border-color:var(--mark);color:#241000;font-weight:700}
.it.brk>.itctl,.it.spaced>.itctl{opacity:.55}
/* 장 오른쪽 위 톱니 — 그 장만 여백·간격을 따로 주는 자리 */
.pgctl{position:absolute;top:3mm;right:3mm;width:20px;height:20px;padding:0;z-index:4;
  border:1px solid var(--rule);background:#fff;border-radius:5px;cursor:pointer;
  font-size:12px;line-height:1;color:var(--ink-3);opacity:0;transition:opacity .12s;font-family:var(--ui)}
.page:hover>.pgctl{opacity:.8}
.pgctl:hover{opacity:1!important;border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.page.pgov>.pgctl{opacity:1;background:var(--mark);border-color:var(--mark);color:#241000;font-weight:700}
.page.pgsel{outline:2px solid var(--blue);outline-offset:3px}
.page.over{outline:1px dashed #c0392b;outline-offset:3px}
.page.over::after{content:"이 블록은 A4 한 장을 넘습니다 — 인쇄 시 자동으로 나뉩니다";
  position:absolute;left:15mm;bottom:4mm;font-size:8pt;color:#c0392b;font-family:var(--ui)}
/* 높이 측정용 숨김 시트 */
#measure{position:absolute!important;left:-99999px;top:0;visibility:hidden;pointer-events:none;
  width:210mm;min-height:0;height:auto;margin:0;box-shadow:none}
.cover{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:261mm}
.cover .en{font-size:26pt;font-weight:700;line-height:1.35;letter-spacing:-.01em}
.cover .dt{margin-top:26mm;font-size:14pt}
.cover .co{margin-top:34mm;font-size:16pt;font-weight:700}
.cover .rule{width:52mm;border-top:2px solid #000;margin:10mm 0}
h2.sec{font-size:12pt;font-weight:700;margin:0 0 8px}
h3.sub{font-size:11pt;font-weight:700;margin:14px 0 6px}
h4.eq{font-size:10.5pt;font-weight:700;margin:12px 0 4px}
h4.eq::before{content:"∎ ";}
.page p{margin:3px 0}
.ind{padding-left:14px}.ind2{padding-left:28px}.ind3{padding-left:42px}
.blue{color:#1546a0}.orange{color:#e2620d;font-weight:700}.uline{text-decoration:underline}
.item{margin:10px 0 4px;font-weight:700}
.itemhd{color:#1546a0}
figure{margin:8px 0 10px;text-align:center}
figcaption{font-size:9.5pt;margin-bottom:4px;font-weight:700}
svg.chart{width:135mm;height:auto;border:1px solid #999;background:#fff}
svg.zone{width:150mm;height:auto}

/* document tables */
table.doc{width:100%;border-collapse:collapse;font-size:9pt;margin:6px 0}
table.doc th,table.doc td{border:1px solid #333;padding:3px 4px;text-align:center;vertical-align:middle}
table.doc th{background:#dbe5f1;font-weight:700}
table.doc td.l{text-align:left}
table.doc .note{font-size:8pt;text-align:left;line-height:1.35}
table.doc.tiny{font-size:7.3pt}
table.doc.tiny th,table.doc.tiny td{padding:2px}
table.spec{width:100%;border-collapse:collapse;font-size:9.5pt;margin:6px 0}
table.spec th,table.spec td{border:1px solid #333;padding:4px 6px;text-align:center}
table.spec th{background:#d9e2f3;font-weight:700;font-size:10.5pt}
table.spec td.k{background:#fff;font-weight:600}
.hl{background:#fff2cc}
.cellhit{background:var(--mark)!important;color:#241000;font-weight:700;box-shadow:inset 0 0 0 2px #a33f00}
.rowhit{background:#fde3c8!important}
.colhit{background:#fdeedd!important}

/* formula */
.fm{display:block;font-family:var(--eq);font-size:13pt;margin:6px 0 6px 10px}
.fm i,.v{font-style:italic;font-family:var(--eq)}
.frac{display:inline-block;vertical-align:middle;text-align:center;margin:0 3px}
.frac>span{display:block;padding:0 4px}
.frac .den{border-top:1.2px solid #000}
/* 근호 : 내용 높이만큼 늘어나는 SVG + 내용 위의 가로선 */
.sqrt{display:inline-flex;align-items:stretch;vertical-align:middle;margin:0 1px}
.sqrt>.rad{flex:0 0 auto;width:.58em;height:auto;align-self:stretch;overflow:visible}
.sqrt>.vin{border-top:1.25px solid currentColor;padding:1px 4px 0 3px}
/* 정의 목록 : 줄마다 별개 요소라서 페이지 경계에서 나뉠 수 있다 */
.dl{font-size:10pt;margin:1px 0 1px 22px;line-height:1.7}
.dl b{font-style:italic;font-family:var(--eq);font-weight:400;display:inline-block;min-width:26px}
.calc{font-family:var(--eq);font-size:10.5pt;margin:4px 0 4px 16px;line-height:1.9}
.calc i,.calc .frac,.calc sup,.calc sub{font-family:var(--eq)}
.calc .res{color:#c0392b;font-weight:700}
.arrow{margin-left:4px}
.sumbox{display:grid;grid-template-columns:1fr 1.6fr;gap:0;border:1px solid #333;font-size:9.5pt;margin-top:10px}
.sumbox .lft{display:grid;grid-template-columns:1fr 1fr}
.sumbox .lft div{border-bottom:1px solid #333;border-right:1px solid #333;padding:3px 5px;text-align:center}
.sumbox .lft div:nth-child(2n){font-weight:700}
.sumbox .lft div:nth-last-child(-n+2){border-bottom:0}
.sumbox .rgt{padding:6px 8px;line-height:1.7}
.smallnote{font-size:8.5pt;color:#333;margin-top:3px}

@media print{
  @page{size:A4;margin:0}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  html,body{background:#fff;width:auto;height:auto;margin:0;padding:0}
  .bar,.side,.tabs{display:none!important}
  .app{display:block;height:auto}
  .work{display:block;overflow:visible;height:auto}
  .stage{overflow:visible;padding:0;background:#fff}
  #report{width:auto;margin:0;zoom:1}
  /* 한 장을 A4 그대로 잡고 여백은 padding 으로 준다. @page 여백을 0 으로 둬야
     브라우저가 주소·날짜·제목·쪽수를 끼워 넣을 자리가 없어져 머리글/바닥글이 사라진다. */
  .page{width:auto;max-width:100%;min-height:0;height:297mm;margin:0;
        box-shadow:none;position:relative;overflow:hidden;
        page-break-after:always;break-after:page;page-break-inside:avoid}
  .page:last-child{page-break-after:auto;break-after:auto}
  .cover{min-height:215mm}
  .itctl,.pgctl,#measure{display:none!important}
  .it.brk::before,.page.over::after{display:none!important}
  .page.pgsel{outline:0}
  .page.over{outline:0;height:auto;overflow:visible;page-break-inside:auto}
  .blk{break-inside:auto;page-break-inside:auto}
  figure,table.spec,.sumbox,table.doc{break-inside:avoid;page-break-inside:avoid}
  svg.chart{width:100%;max-width:140mm;height:auto}
  svg.zone{width:100%;max-width:160mm;height:auto}
  p,li{orphans:2;widows:2}
}
/* 미리보기 축소는 화면에서만. screen 을 빼면 인쇄 레이아웃 폭(210mm=794px)도
   max-width 조건에 걸려 인쇄물 전체가 72% 로 줄어든다. */
@media screen and (max-width:1180px){.work{grid-template-columns:1fr}.side{max-height:46vh}#report{zoom:.72}}
@media screen and (max-width:1560px) and (min-width:1181px){#report{zoom:.86}}

<div class="app">

      </div>

      <div class="tabpane" id="pane-src"></div>

    <main class="stage"><div id="report"></div></main>
  </div>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const CIRC=["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩","⑪","⑫","⑬","⑭","⑮"];
const R_GAS=8314, PA_ATM=101325, G=9.8;

/* ===================== 운전압력 =====================
   지침 <부록 1> <참고> 단위 기호(인쇄 54p)는 두 압력을 구분한다.
     P  : 용기의 내부압력(Pa)          → 가스식 (식2)(식3)(식4) 에 들어가는 절대압
     ΔP : 개구부에서의 누설 압력차(Pa) → 액체식 (식1) 에 들어가는 압력차
   따라서 같은 운전압력이라도 가스는 절대압, 액체는 게이지압으로 쓴다.
   "상압"은 게이지 0(= 절대 1atm)이라는 뜻이므로 액체 ΔP 는 액주 ρgh 만 남는다. */
/* "상압"은 단위가 아니라 "가압하지 않음(게이지 0)"이라는 뜻이고, "atm"은 크기가 1기압인
   실제 단위다. 둘을 같은 이름으로 두면 2 atm 같은 값을 넣을 방법이 없어져 따로 뒀다. */
/* mmH2O·mmHg 는 표준중력(9.80665)으로 정의된 단위라 계산용 G(9.8)와 무관하게 정의값을 쓴다.
   브리더밸브·통기구 설정압이 보통 이 단위로 적혀 있어 넣어 둔다. */
const P_UNITS={"상압":null,"mmH2O":9.80665,"mmHg":133.322387415,
  "kPa":1e3,"MPa":1e6,"bar":1e5,"atm":PA_ATM,"kgf/cm²":98066.5,"psi":6894.757};
const P_UNIT_LABEL={"상압":"상압(가압 없음)"};

/* 빈칸을 0 으로 보면 안 된다. +"" 는 0 이라, 단위만 고르고 숫자를 아직 안 넣은 상태가
   "0 bar 로 가압됨"으로 읽혀 엉뚱한 경고가 떴다. 빈칸은 미입력으로 돌려준다. */
function popNum(s){
  if(s.Pop===""||s.Pop==null)return NaN;
  const v=+s.Pop; return isFinite(v)?v:NaN;
}
function popPa(s){
  const u=s.PopUnit||"상압", f=P_UNITS[u];
  if(f==null)return {isATM:true,ok:true,Pg:0,Pabs:PA_ATM};       // 상압
  const v=popNum(s);
  if(!isFinite(v))return {isATM:false,ok:false,Pg:NaN,Pabs:NaN}; // 미입력
  const Pabs=(s.PopBasis==="a")?v*f:v*f+PA_ATM;
  return {isATM:false,ok:true,Pg:Pabs-PA_ATM,Pabs:Pabs};
}
/* 목록표·계산서에 찍는 표기 (예: "0.5 MPa") */
function popLabel(s){
  const u=s.PopUnit||"상압";
  if(P_UNITS[u]==null)return "ATM";   // 목록표 표기는 관행대로 ATM
  const v=popNum(s);
  return isFinite(v)?`${trim(String(v))} ${u}`:"-";
}

/* ===================== 취급물질의 상(相) =====================
   지침 <표3> 누출원목록의 범례 : G(가스) · L(액체) · LG(액화가스) · S(고체).
   먼저 상을 고르고, 그 상에서 뜻이 통하는 누출원 유형만 고르게 한다. */
const PHASES={
 "L" :{label:"액체 (L)",     hint:"상압 이상에서 액체로 저장·이송되는 인화성 액체"},
 "G" :{label:"가스 (G)",     hint:"압축가스·증기 등 기체 상태로 취급되는 인화성 가스"},
 "LG":{label:"액화가스 (LG)",hint:"LPG·암모니아 등 가압해 액화한 가스. 누출 시 플래시 증발한다"}
};

/* ===================== 누출원 유형 =====================
   지침 <부록 3> 의 계산 예시가 유형마다 압력을 다르게 잡는다. 그 차이를 프리셋으로 굳혀 둔다.
     mode   liquid = 액체 오리피스(식1) → 증발풀(식6)
            gas    = 가스 오리피스(식3)(식4)
            flash  = 가압 액화가스. 액체 오리피스로 W 를 구한 뒤 플래시분율만큼만 증기가 된다
            given  = 오리피스식을 쓰지 않고 제조사 데이터의 누출률을 그대로 쓴다
     phases 이 유형을 고를 수 있는 상
     atm    이 유형의 기본이 상압인가 (잠그지는 않는다)
     head   액주 ρgh 를 ΔP 에 넣을지. "opt" 는 넣되 기본 0 (토출압이 지배적이라)  */
const SRC_TYPES={
 "상압탱크":{mode:"liquid",phases:["L"],atm:true,head:true,pool:"both",
   desc:"대기와 연결된 고정 통기구가 있는 고정지붕 탱크 등 대기 개방 액면",
   press:"ΔP = ρgh (운전압력 상압)",
   ref:"지침 5.3.1 연속누출등급 ① — 대기와 연결된 고정 통기구가 설치된 고정지붕 탱크 내부의 인화성 액체 표면"},
 "가압탱크":{mode:"liquid",phases:["L"],atm:false,head:true,pool:"spill",
   desc:"질소 봉입 등으로 가압된 저장용기. ΔP 에 게이지 운전압력이 더해진다",
   press:"ΔP = P게이지 + ρgh",
   ref:"지침 6.2.2 (식1) — ΔP 는 '개구부에서의 누설 압력차'"},
 "펌프":{mode:"liquid",phases:["L"],atm:false,head:"opt",pool:"spill",
   desc:"펌프·압축기 기계씰 및 토출배관. ΔP 는 토출압이 지배하고 액주는 보통 무시한다",
   press:"ΔP = 토출압(게이지). 액주는 기본 0",
   ref:"지침 <부록 3> 2.2.1 (1)(2) 산업용 펌프 — ΔP = 15 bar 로 계산"},
 "액체배관":{mode:"liquid",phases:["L"],atm:false,head:true,pool:"spill",
   desc:"액체 배관의 플랜지·밸브 스템 패킹·연결부",
   press:"ΔP = P게이지 + ρgh",
   ref:"지침 <표1> 2차 누출등급의 누출구멍 단면적"},
 "가스배관":{mode:"gas",phases:["G"],atm:false,head:false,pool:null,
   desc:"가스 배관의 제어밸브 스템 패킹·플랜지 등 밀봉부",
   press:"P = 절대압 (게이지 + 1 atm)",
   ref:"지침 <부록 3> 2.2.2 (1) 제어밸브 — 사용압력 10 bar(게이지)"},
 "가스용기":{mode:"gas",phases:["G"],atm:false,head:false,pool:null,
   desc:"압축가스 용기·리시버 등 가압 용기의 밀봉부",
   press:"P = 절대압 (게이지 + 1 atm)",
   ref:"지침 6.2.3 (식2)(식3)(식4) — P 는 '용기의 내부압력'"},
 "액화가스":{mode:"flash",phases:["LG"],atm:false,head:"opt",pool:null,
   desc:"LPG 등 가압 액화가스. 누출점에서 일부가 플래시 증발하고 나머지는 배출된다",
   press:"ΔP = P게이지 + ρgh → Wg = W × Fv",

  }else{
    r.Qa역산 = null;
    if(isFinite(QaIn)&&QaIn>0)r.Qa=QaIn;
    r.uw유도 = (고려 && isFinite(QaIn) && QaIn>0 && r.단면) ? SIG(QaIn/r.단면,3) : null;
  }
  /* 계산서에 인쇄되는 자리수로 잘라 두어야 적힌 값으로 손검산이 맞는다 */
  r.uw = r.uw유도!=null ? r.uw유도 : +s.uw;

  if(TY.mode==="given"){
    /* 브리더밸브 등 — 제조사 데이터의 누출률을 그대로 쓴다(지침 <부록 3> 2.2.1 (3)) */
    r.Wg = +s.Wg직접;
    r.Qg = SIG(r.Wg,3)/SIG(r.rho_g,4);
    r.C  = SIG(r.Qg,3)/(k*LFLp);
  }else if(TY.mode==="liquid"||TY.mode==="flash"){
    /* ΔP = 게이지 운전압력 + 액주 ρgh.
       상압이면 앞항이 0 이라 지금까지처럼 ρgh 만 남는다. */
    r.dPhead = TY.head ? rho*G*(+s.h||0) : 0;
    r.dPop   = P0.isATM ? 0 : P0.Pg;
    r.dP = s.dPmode==="head" ? (r.dPhead+r.dPop) : +s.dP;
    if(isFinite(r.dP)&&r.dP<0){r.dPneg=true;r.dP=0}   // 부압이면 액이 밀려나가지 않는다
    /* 계산서에 적히는 ΔP. 두 항을 각각 정수 Pa 로 적으므로 합계도 적힌 두 정수의 합이어야
       손으로 더해 본 값과 맞는다(7,999 + 24,637 을 적고 32,637 로 끝내면 안 된다).
       계산 자체는 위의 정확한 r.dP 로 하고, 이 값은 표기에만 쓴다. */
    r.dPshow = (!r.dPneg && s.dPmode==="head" && !P0.isATM && TY.head && r.dPhead>0)
      ? Math.round(r.Pg)+Math.round(r.dPhead)
      : Math.round(r.dP);
    r.hEq = r.dPshow/(rho*G);          // ΔP 를 직접 넣었을 때의 상당 액주높이
    /* 아래 한 줄부터가 계산서의 계산 순서다. 각 단계는 앞 단계에서 "인쇄된" 값을 받는다 */
    r.W  = (+s.Cd)*S_m2*Math.sqrt(2*rho*r.dPshow);
    if(TY.mode==="flash"){
      /* 가압 액화가스 : 누출점에서 플래시 증발한 분율만 증기운이 된다.
         지침 <부록 3> 2.2.1 (1) 이 Wg 를 "증기화된 액체비율"(W의 2%)로 잡은 방식과 같다.
         남은 액체는 지침 예제처럼 배출되는 것으로 보고 풀은 세지 않는다. */
      r.Fv = (+s.Fv)/100;
      r.Wg = SIG(r.W,4)*r.Fv;
      r.Qg = SIG(r.Wg,3)/SIG(r.rho_g,4);
      r.C  = SIG(r.Qg,3)/(k*LFLp);
    }else{
      r.V  = SIG(r.W,4)*(+s.t)/rho;
      if(s.poolMode==="tank"){ r.Ap=Math.PI*Math.pow(+s.D,2)/4; }
      else { r.Ap=SIG(r.V,4)/0.01; }
      r.Qg = 6.5*Math.pow(r.uw,0.78)*SIG(r.Ap,4)*Pv/(1e5*Math.pow(M,0.333))*(Tap/Topp);
      r.C  = SIG(r.Qg,3)/(k*LFLp);
      r.Wg = null;
    }
  }else{
    /* 가스식의 P 는 "용기의 내부압력" = 절대압이다. */
    const g=+m.gamma, P=P0.Pabs, T=+s.T_gas;
    const Z=(+s.Z>0)?+s.Z:1;              // 압축계수. 지침 6.2.3.1(3),(4)
    r.gamma=g;r.P=P;r.T=T;r.Z=Z;
    r.Pc = PA_ATM*Math.pow((g+1)/2, g/(g-1));
    r.choked = P>=r.Pc;
    if(r.choked){
      r.Wg=(+s.Cd)*S_m2*P*Math.sqrt(g*M/(Z*R_GAS*T)*Math.pow(2/(g+1),(g+1)/(g-1)));
    }else{
      const inner=M/(Z*R_GAS*T)*(2*g/(g-1))*(1-Math.pow(PA_ATM/P,(g-1)/g));
      r.Wg=(+s.Cd)*S_m2*P*Math.sqrt(Math.max(inner,0))*Math.pow(PA_ATM/P,1/g);
    }
    r.rho_g = PA_ATM*M/(R_GAS*Tap);
    r.Qg = SIG(r.Wg,3)/SIG(r.rho_g,4);
    r.C  = SIG(r.Qg,3)/(k*LFLp);
  }
  // 희석등급
  const uw=r.uw;
  r.done=isFinite(r.C)&&r.C>0;          // 필수 입력이 채워져 계산이 성립하는가
  if(!r.done){
    const miss=[];
    if(!r.popOk)miss.push("운전압력");
    if(TY.mode==="given"&&(!isFinite(+s.Wg직접)||+s.Wg직접<=0))miss.push("누출률 Wg (제조사 데이터)");
    if(TY.mode==="flash"&&(!isFinite(+s.Fv)||+s.Fv<=0))miss.push("플래시 증발분율 Fv");
    if(TY.mode==="liquid"||TY.mode==="flash"){
      if(TY.mode==="liquid"&&s.poolMode!=="tank"&&(!isFinite(+s.t)||+s.t<=0))miss.push("누출시간 t");
      /* 가압 상태에서는 ΔP 를 운전압력이 만드므로 h 는 0(누출점이 액면 높이)이어도 된다. */
      if(s.dPmode==="head"?(r.isATM&&(!isFinite(+s.h)||+s.h<=0)):(!isFinite(+s.dP)||+s.dP<=0))
        miss.push(s.dPmode==="head"?"액주높이 h":"누설 압력차 ΔP");
    }
    if(TY.mode==="gas"&&r.isATM)
      r.msg.push("가스는 <b>상압</b>에서 누출을 구동할 압력차가 없어 W<sub>g</sub> = 0 입니다. 운전압력을 입력하세요.");
    if(miss.length)r.msg.push(`${miss.join(" · ")} 을(를) 입력해야 계산됩니다.`);
    if(!r.msg.length)r.msg.push("입력값이 부족하여 계산할 수 없습니다.");
  }
  if(r.dPneg)r.msg.push("운전압력이 대기압보다 낮아(부압) 액주를 더해도 개구부 안쪽 압력이 대기압에 못 미칩니다. 액체가 유출되는 대신 외기가 유입되는 조건이므로 <b>이 개구부는 액체 누출원이 아니며 W = 0</b> 입니다. 누출점 위치와 액면높이 h 를 다시 확인하세요.");
  /* 배경농도 평가 — <부록 2> 2.6.2 (식 1) Xb = f·Qg/Qa.
     옥내(밀폐공간)는 차트를 보기 전에 이 값을 임계농도(LFL의 25 %, <부록 1> 3 (3)(가))와
     먼저 견준다. 넘으면 희석등급 차트는 제로 배경농도 기반이라 쓸 수 없고(<부록 2> 2.5 (1),
     <부록 3> 2.2.1 (2) 비고),
     희석등급은 바로 저희석이 된다(<부록 2> 2.5 (4)). */
  r.Xcrit = 0.25*LFLp;
  r.배경 = s.배경평가==="고려";
  if(r.배경){
    const Qa=r.Qa, f=(+s.배경f>0)?+s.배경f:1, V0=+s.배경V0;
    r.f=f;
    r.배경ok = r.done && isFinite(Qa) && Qa>0;
    if(r.배경ok){
      r.Xb = f*SIG(r.Qg,3)/Qa;
      r.Xb초과 = r.Xb>r.Xcrit;
      if(isFinite(V0)&&V0>0){r.V0=V0; r.C교환=Qa/V0}
    }else if(r.done){
      r.msg.push(s.Qa모드==="역산"
      ? "배경농도를 고려하는 조건으로 두었으나 <b>단면(L·B)</b> 이 없어 공기 유량을 역산하지 못했습니다."
      : "배경농도를 고려하는 조건으로 두었으나 <b>공기 유량 Q<sub>a</sub></b> 가 없어 배경농도를 계산하지 못했습니다.");
    }
  }else if(s.위치==="옥내"){
    r.msg.push("지침 &lt;부록 2&gt; 2.6.1 (3)(다)는 제로 배경농도를 옥외 또는 옥내 누출원 주변에 국소배기장치가 있는 곳에서 인정하므로 배경농도를 고려하지 않음.");
  }
  r.bHi = DIL_HI.a*Math.pow(r.C,DIL_HI.b);
  r.bLo = DIL_LO.a*Math.pow(r.C,DIL_LO.b);
  r.희석auto = r.done ? (uw>=r.bHi ? "고희석" : (uw<=r.bLo ? "저희석" : "중희석")) : "-";
  /* 배경농도가 임계농도를 넘으면 차트 판독보다 이쪽이 앞선다 */
  r.희석배경 = (r.배경 && r.배경ok && r.Xb초과) ? "저희석" : null;
  r.희석 = s.희석모드==="auto" ? (r.희석배경||r.희석auto) : s.희석수동;
  // 종별
  r.이용도 = s.이용도==="직접입력" ? s.이용도적용 : s.이용도;
  r.cell = (r.희석==="-") ? "-" : zoneCell(s.등급, r.희석, r.이용도);
  r.zone = (r.cell==="-") ? "-" : zoneShort(r.cell);
  r.NE = /^비위험/.test(String(r.cell).replace(/<br>/g,""));
  // 범위
  const cv=EXT[s.누출형태];
  r.rRaw = cv.a*Math.pow(r.C,cv.b);
  /* 차트 판독값도 계산서에 적히는 자리수(4자리)로 잘라 쓴다. 적힌 r 을 0.1 m 로 올린 값이
     범위가 되어야, 계산서에 "r = 20.70 m → 20.7 m" 처럼 앞뒤가 맞는다. */
  r.rShow = SIG(r.rRaw,4);
  r.rChart = Math.max(1, r.rShow);
  r.belowChart = r.rShow<1;
  // 소수 1자리, 올림(반내림하면 실제 반경보다 작게 적힐 수 있다)
  r.범위 = s.범위모드==="auto" ? (r.done?Math.max(1,Math.ceil(r.rChart*10)/10):"-") : (+s.범위수동||0);
  // 도면 수평·수직 범위를 비워두면 산정된 범위를 그대로 쓴다
  r.수평 = (String(s.수평).trim()==="")?r.범위:(+s.수평);
  r.수직 = (String(s.수직).trim()==="")?r.범위:(+s.수직);
  if(r.NE) r.msg.push("판정 결과가 NE(무시할 수 있는 범위)이므로 지침 &lt;부록 3&gt; &lt;그림 1&gt; 비고에 따라 범위 그래프로 거리를 산정하지 않는다.");
  if(s.위치==="옥내"&&r.희석==="저희석") r.msg.push(r.희석배경
    ? "옥내·저희석(배경농도&gt;임계농도) 조건이므로, 지침 &lt;부록 3&gt; 1.2 (3) 및 &lt;부록 2&gt; 3.3 (4)에 따라 공간 전체를 하나의 폭발위험장소로 구분한다."
    : "옥내·저희석 조건이다. 지침 &lt;부록 3&gt; 1.2 (3) 및 &lt;부록 2&gt; 3.3 (4)에 따라 밀폐공간 전체를 하나의 폭발위험장소로 구분하고 개구부를 별도 누출원으로 검토해야 한다.");
  return r;
}
const ZONE_TBL={
  "연속":{"고희석":{"우수":"비위험<br>(0종 NE)","양호":"2종 장소<br>(0종 NE)","미흡":"1종 장소<br>(0종 NE)"},
        "중희석":{"우수":"0종 장소","양호":"0종 장소<br>+1종 장소","미흡":"0종 장소<br>+1종 장소"},
        "저희석":{"*":"0종 장소"}},
  "1차":{"고희석":{"우수":"비위험<br>(1종 NE)","양호":"2종 장소<br>(1종 NE)","미흡":"2종 장소<br>(1종 NE)"},
        "중희석":{"우수":"1종 장소","양호":"1종 장소<br>+2종 장소","미흡":"1종 장소<br>+2종 장소"},
        "저희석":{"*":"1종 또는<br>0종 장소"}},
  "2차":{"고희석":{"우수":"비위험<br>(2종 NE)","양호":"비위험<br>(2종 NE)","미흡":"2종 장소"},
        "중희석":{"우수":"2종 장소","양호":"2종 장소","미흡":"2종 장소"},
        "저희석":{"*":"1종 및 0종<br>장소"}}
};
function zoneCell(g,d,u){const row=ZONE_TBL[g]||ZONE_TBL["2차"];const col=row[d]||row["중희석"];return col["*"]||col[u]||col["미흡"]}
function zoneShort(c){let t=c.replace(/<br>/g,"").replace(/\([^)]*NE[^)]*\)/g,"");
  if(/^비위험/.test(t))return"비위험";
  const mm=t.match(/[012]종/g);
  if(!mm)return"-";
  return [...new Set(mm)].join("+");
}
function zoneClass(z){if(/0종/.test(z))return"z0";if(/1종/.test(z))return"z1";if(/2종/.test(z))return"z2";return"zn"}

/* ===================== 그래프(SVG) ===================== */
function lg(v,min,max,p0,p1){return p0+(Math.log10(v)-Math.log10(min))/(Math.log10(max)-Math.log10(min))*(p1-p0)}
function gridLines(xmin,xmax,ymin,ymax,X0,X1,Y0,Y1){
  let g="";
  for(let d=Math.log10(xmin);d<=Math.log10(xmax)+1e-9;d++){
    for(let i=1;i<10;i++){const v=i*Math.pow(10,d);if(v>xmax*1.0001)break;
      const x=lg(v,xmin,xmax,X0,X1);
      g+=`<line x1="${x.toFixed(1)}" y1="${Y1}" x2="${x.toFixed(1)}" y2="${Y0}" stroke="#d5d5d5" stroke-width="${i===1?1:.5}"/>`;}
  }
  for(let d=Math.log10(ymin);d<=Math.log10(ymax)+1e-9;d++){
    for(let i=1;i<10;i++){const v=i*Math.pow(10,d);if(v>ymax*1.0001)break;
      const y=lg(v,ymin,ymax,Y1,Y0);
      g+=`<line x1="${X0}" y1="${y.toFixed(1)}" x2="${X1}" y2="${y.toFixed(1)}" stroke="#d5d5d5" stroke-width="${i===1?1:.5}"/>`;}
  }
  return g;
}
function axLabels(min,max,axis,X0,X1,Y0,Y1){
  let g="";
  for(let d=Math.log10(min);d<=Math.log10(max)+1e-9;d++){
    const v=Math.pow(10,d), t=(v>=0.001&&v<10000)?trim(v.toFixed(Math.max(0,-d))):v.toExponential();
    if(axis==="x"){const x=lg(v,min,max,X0,X1);g+=`<text x="${x.toFixed(1)}" y="${Y1+16}" font-size="11" text-anchor="middle" font-family="Arial">${t}</text>`}
    else{const y=lg(v,min,max,Y1,Y0);g+=`<text x="${X0-6}" y="${(y+4).toFixed(1)}" font-size="11" text-anchor="end" font-family="Arial">${t}</text>`}
  }
  return g;
}
function powLine(a,b,xmin,xmax,ymin,ymax,X0,X1,Y0,Y1,color,w){
  const pts=[];const n=180;
  for(let i=0;i<=n;i++){
    const x=xmin*Math.pow(xmax/xmin,i/n), y=a*Math.pow(x,b);
    if(y<ymin*0.9||y>ymax*1.1)continue;
    pts.push(lg(x,xmin,xmax,X0,X1).toFixed(1)+","+lg(y,ymin,ymax,Y1,Y0).toFixed(1));
  }
  return `<polyline points="${pts.join(" ")}" fill="none" stroke="${color}" stroke-width="${w||2.2}"/>`;
}
function marker(cx,cy,label){
  return `<g><circle cx="${cx}" cy="${cy}" r="10" fill="none" stroke="#f5761a" stroke-width="4.5"/>`+
   `<circle cx="${cx}" cy="${cy}" r="3.4" fill="#f5761a"/></g>`;
}
// 희석등급 그래프
function chartDilution(r){
  const X0=78,X1=618,Y0=28,Y1=428, xmin=1e-3,xmax=1e2, ymin=1e-3,ymax=1e1;
  let g=`<svg class="chart" viewBox="0 0 660 470" xmlns="http://www.w3.org/2000/svg">`;
  g+=`<rect x="0" y="0" width="660" height="470" fill="#fff"/>`;
  g+=gridLines(xmin,xmax,ymin,ymax,X0,X1,Y0,Y1);
  g+=`<rect x="${X0}" y="${Y0}" width="${X1-X0}" height="${Y1-Y0}" fill="none" stroke="#333"/>`;
  g+=axLabels(xmin,xmax,"x",X0,X1,Y0,Y1)+axLabels(ymin,ymax,"y",X0,X1,Y0,Y1);
  g+=powLine(DIL_HI.a,DIL_HI.b,xmin,xmax,ymin,ymax,X0,X1,Y0,Y1,"#1f4fd8");
  g+=powLine(DIL_LO.a,DIL_LO.b,xmin,xmax,ymin,ymax,X0,X1,Y0,Y1,"#e02020");
  const box=(x,y,t)=>`<rect x="${x}" y="${y}" width="72" height="26" fill="#fff" stroke="#1f4fd8"/><text x="${x+36}" y="${y+18}" font-size="12" text-anchor="middle" font-family="Malgun Gothic">${t}</text>`;
  g+=box(120,88,"고희석")+box(330,190,"중희석")+box(490,290,"저희석");
  g+=`<text x="${(X0+X1)/2}" y="${Y1+40}" font-size="11.5" text-anchor="middle" font-family="Malgun Gothic">누출 특성  W&#8342;/(ρ&#8342; × k × LFL)  (m³/s)</text>`;
  g+=`<text transform="translate(22,${(Y0+Y1)/2}) rotate(-90)" font-size="11.5" text-anchor="middle" font-family="Malgun Gothic">환기속도  u&#8383;  (m/s)</text>`;
  if(r&&isFinite(r.C)&&r.C>0){
    const cx=Math.min(Math.max(lg(Math.min(Math.max(r.C,xmin),xmax),xmin,xmax,X0,X1),X0),X1);
    const cy=Math.min(Math.max(lg(Math.min(Math.max(r.uw,ymin),ymax),ymin,ymax,Y1,Y0),Y0),Y1);
    g+=`<line x1="${X0}" y1="${cy}" x2="${cx}" y2="${cy}" stroke="#f5761a" stroke-width="1" stroke-dasharray="5 4"/>`;
    g+=`<line x1="${cx}" y1="${Y1}" x2="${cx}" y2="${cy}" stroke="#f5761a" stroke-width="1" stroke-dasharray="5 4"/>`;
    g+=marker(cx,cy);
    g+=`<text x="${cx+16}" y="${cy-12}" font-size="11" font-family="Malgun Gothic" fill="#c2410c">(${num(r.C).replace(/<[^>]+>/g,"^")} , ${num(r.uw)})</text>`;
  }
  return g+`</svg>`;
}

function chartExtent(r,type){
  const X0=78,X1=618,Y0=28,Y1=388, xmin=1e-2,xmax=1e2, ymin=1,ymax=1e2;
  let g=`<svg class="chart" viewBox="0 0 660 430" xmlns="http://www.w3.org/2000/svg">`;
  g+=`<rect x="0" y="0" width="660" height="430" fill="#fff"/>`;
  g+=gridLines(xmin,xmax,ymin,ymax,X0,X1,Y0,Y1);
  g+=`<rect x="${X0}" y="${Y0}" width="${X1-X0}" height="${Y1-Y0}" fill="none" stroke="#333"/>`;
  g+=axLabels(xmin,xmax,"x",X0,X1,Y0,Y1)+axLabels(ymin,ymax,"y",X0,X1,Y0,Y1);
  g+=powLine(EXT.무거운가스.a,EXT.무거운가스.b,xmin,xmax,ymin,ymax,X0,X1,Y0,Y1,"#e02020");
  g+=powLine(EXT.저속확산.a,EXT.저속확산.b,xmin,xmax,ymin,ymax,X0,X1,Y0,Y1,"#1f4fd8");
  g+=powLine(EXT.고속제트.a,EXT.고속제트.b,xmin,xmax,ymin,ymax,X0,X1,Y0,Y1,"#2f7d32");
  g+=`<text x="470" y="72" font-size="12" font-family="Malgun Gothic" fill="#c00">무거운 가스</text>`;
  g+=`<text x="470" y="128" font-size="12" font-family="Malgun Gothic" fill="#1f4fd8">저속의 확산</text>`;
  g+=`<text x="470" y="182" font-size="12" font-family="Malgun Gothic" fill="#2f7d32">고속의 제트</text>`;
  g+=`<text x="${(X0+X1)/2}" y="${Y1+40}" font-size="11.5" text-anchor="middle" font-family="Malgun Gothic">누출 특성  W&#8342;/(ρ&#8342; × k × LFL)  (m³/s)</text>`;
  g+=`<text transform="translate(22,${(Y0+Y1)/2}) rotate(-90)" font-size="11.5" text-anchor="middle" font-family="Malgun Gothic">폭발위험장소의 범위 (m)</text>`;
  if(r&&isFinite(r.C)&&r.C>0){
    const cx=Math.min(Math.max(lg(Math.min(Math.max(r.C,xmin),xmax),xmin,xmax,X0,X1),X0),X1);
    const cy=Math.min(Math.max(lg(Math.min(Math.max(r.rChart,ymin),ymax),ymin,ymax,Y1,Y0),Y0),Y1);
    g+=`<line x1="${X0}" y1="${cy}" x2="${cx}" y2="${cy}" stroke="#f5761a" stroke-width="1" stroke-dasharray="5 4"/>`;
    g+=`<line x1="${cx}" y1="${Y1}" x2="${cx}" y2="${cy}" stroke="#f5761a" stroke-width="1" stroke-dasharray="5 4"/>`;
    g+=marker(cx,cy);
    g+=`<text x="${cx+16}" y="${cy-12}" font-size="11" font-family="Malgun Gothic" fill="#c2410c">r = ${num(r.rChart)} m</text>`;
  }
  return g+`</svg>`;
}

function tblUw(sel,click,cls,cell,mark){

function tblUwDoc(sel,cell,mark){

function tblZone(등급,희석,이용도,hi){
  const DIL=["고희석","중희석","저희석"],UTL=["우수","양호","미흡"];
  const head=`<tr><th rowspan="4" style="width:52px">누출<br>등급</th><th colspan="7">환기유효성</th></tr>
  <tr><th colspan="3">고희석</th><th colspan="3">중희석</th><th>저희석</th></tr>
  <tr><th colspan="7">환기 이용도</th></tr>
  <tr>${UTL.map((u,i)=>`<th class="${hi&&희석==="고희석"&&이용도===u?"colhit":""}">${u}<br>(${["good","fair","poor"][i]})</th>`).join("")}
     ${UTL.map(u=>`<th class="${hi&&희석==="중희석"&&이용도===u?"colhit":""}">${u}</th>`).join("")}
     <th class="${hi&&희석==="저희석"?"colhit":""}">우수,<br>양호,<br>미흡</th></tr>`;
  let body="";
  for(const g of ["연속","1차","2차"]){
    const rowOn=hi&&g===등급;
    body+=`<tr><td class="${rowOn?"rowhit":""}"><b>${g}${g==="2차"?"<sup>b</sup>":""}</b></td>`;
    for(const d of DIL){
      const us= d==="저희석"?["*"]:UTL;
      for(const u of us){
        const val=zoneCell(g,d,u==="*"?"우수":u);
        const isCell=hi&&g===등급&&d===희석&&(d==="저희석"||u===이용도);
        const colOn=hi&&d===희석&&(d==="저희석"||u===이용도);
        body+=`<td class="${isCell?"cellhit":(rowOn?"rowhit":(colOn?"colhit":""))}">${val}${/NE/.test(val)?"<sup>a</sup>":""}</td>`;
      }
    }
    body+=`</tr>`;
  }
  const note=`<tr><td colspan="8" class="note">a 0종 NE, 1종 NE, 2종 NE 는 정상조건에서는 무시될 수 있는 범위의 이론적 폭발위험장소를 말한다.<br>
  b 2차 누출등급으로 형성된 2종 장소가 1차 또는 연속 누출등급에 의한 장소보다 클 수 있다. 이 경우, 더 큰 거리를 선정하는 것이 좋다.<br>
  c 환기가 아주 약하고 실제로 폭발성 가스분위기가 지속되는 누출의 경우(즉, 환기되지 않는 것에 가까운 상태)에는 0종 장소에 속할 수 있다.<br>
  '+'는 '~에 둘러싸여 있음'을 뜻한다. 자연환기가 일어나는 밀폐공간에서의 환기이용도는 '우수'로 고려해서는 안 된다.</td></tr>`;
  return `<table class="doc" style="font-size:8.5pt">${head}${body}${note}</table>`;
}

/* ===================== 수식 HTML =====================
   근호는 글자(√)로 그리면 내용이 두 줄 이상일 때 기호가 본문 크기 그대로
   바닥에 남고 윗선이 지수를 가로지른다. 내용 높이에 맞춰 늘어나는 SVG 로 그린다.
   vector-effect 로 선 굵기는 늘어나지 않게 고정한다. */
function SQ(inner){
  return `<span class="sqrt"><svg class="rad" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">`
    +`<path d="M0,63 L21,55 L45,98 L100,0" fill="none" stroke="currentColor" stroke-width="1.25"`
    +` vector-effect="non-scaling-stroke" stroke-linejoin="miter" stroke-linecap="square"/></svg>`
    +`<span class="vin">${inner}</span></span>`;
}
const EQ={
 liq:`<span class="fm"><i>W</i> = <i>C<sub>d</sub></i><i>S</i>${SQ(`2<i>ρ</i>Δ<i>P</i>`)}</span>`,
 pool:`<span class="fm"><i>Q<sub>g</sub></i> = <span class="frac"><span>6.5<i>u<sub>w</sub></i><sup>0.78</sup><i>A<sub>p</sub></i><i>P<sub>v</sub></i></span><span class="den">10<sup>5</sup><i>M</i><sup>0.333</sup></span></span> × <span class="frac"><span><i>T<sub>a</sub></i></span><span class="den"><i>T</i></span></span> (m³/s)</span>`,
 pc:`<span class="fm"><i>P<sub>C</sub></i> = <i>P<sub>a</sub></i>[<span class="frac"><span><i>γ</i>+1</span><span class="den">2</span></span>]<sup><i>γ</i>/(<i>γ</i>−1)</sup></span>`,
 nonchoked:`<span class="fm"><i>W<sub>g</sub></i> = <i>C<sub>d</sub>SP</i>${SQ(`<span class="frac"><span><i>M</i></span><span class="den"><i>ZRT</i></span></span><span class="frac"><span>2<i>γ</i></span><span class="den"><i>γ</i>−1</span></span>[1−(<span class="frac"><span><i>P<sub>a</sub></i></span><span class="den"><i>P</i></span></span>)<sup>(<i>γ</i>−1)/<i>γ</i></sup>]`)}(<span class="frac"><span><i>P<sub>a</sub></i></span><span class="den"><i>P</i></span></span>)<sup>1/<i>γ</i></sup></span>`,
 choked:`<span class="fm"><i>W<sub>g</sub></i> = <i>C<sub>d</sub>SP</i>${SQ(`<i>γ</i><span class="frac"><span><i>M</i></span><span class="den"><i>ZRT</i></span></span>[<span class="frac"><span>2</span><span class="den"><i>γ</i>+1</span></span>]<sup>(<i>γ</i>+1)/(<i>γ</i>−1)</sup>`)}</span>`,
 char:`<span class="fm">누출특성 = <span class="frac"><span><i>W<sub>g</sub></i></span><span class="den"><i>ρ<sub>g</sub></i> × <i>k</i> × LFL</span></span> = <span class="frac"><span><i>Q<sub>g</sub></i></span><span class="den"><i>k</i> × LFL</span></span></span>`,
 xb:`<span class="fm"><i>X<sub>b</sub></i> = <i>f</i> × <span class="frac"><span><i>Q<sub>g</sub></i></span><span class="den"><i>Q<sub>a</sub></i></span></span> (vol/vol)</span>`,
 xcrit:`<span class="fm"><i>X<sub>crit</sub></i> = 0.25 × LFL</span>`,
 ap:`<span class="fm"><i>A<sub>p</sub></i> = <span class="frac"><span><i>V</i><sub>누출</sub></span><span class="den">0.01 m</span></span> , <i>V</i><sub>누출</sub> = <span class="frac"><span><i>W</i> × <i>t</i></span><span class="den"><i>ρ</i></span></span> , <i>W</i> = <i>C<sub>d</sub>S</i>${SQ(`2<i>ρ</i>Δ<i>P</i>`)}</span>`
};
const DEF={
 liq:`<div class="dl"><b><i>W</i></b> : 액체의 누출율 (kg/s)</div><div class="dl"><b><i>C<sub>d</sub></i></b> : 누출계수 (단위 없음), 일반적으로 모난 오리피스는 0.5~0.75</div><div class="dl"><b><i>S</i></b> : 유체가 누출되는 개구부(구멍)의 단면적 (m²)</div><div class="dl"><b><i>ρ</i></b> : 액체 밀도 (kg/m³)</div><div class="dl"><b>Δ<i>P</i></b> : 개구부에서의 누설 압력 차 (Pa)</div>`,
 pool:`<div class="dl"><b><i>Q<sub>g</sub></i></b> : 부피증발률 (m³/s)</div><div class="dl"><b><i>u<sub>w</sub></i></b> : 풀 표면 풍속 (m/s)</div><div class="dl"><b><i>A<sub>p</sub></i></b> : 풀 표면적 (m²)</div><div class="dl"><b><i>P<sub>v</sub></i></b> : 액체 증기압 (kPa)</div><div class="dl"><b><i>M</i></b> : 몰질량 (kg/kmol)</div><div class="dl"><b><i>R</i></b> : 기체상수 (8314 J/kmol·K)</div><div class="dl"><b><i>T<sub>a</sub></i></b> : 주위온도 (K)</div><div class="dl"><b><i>T</i></b> : 유체온도 (K)</div>`,
 gas:`<div class="dl"><b><i>W<sub>g</sub></i></b> : 가스누출률 (kg/s)</div><div class="dl"><b><i>C<sub>d</sub></i></b> : 누출계수(단위없음), 일반적으로 모난 오리피스는 0.5~0.75</div><div class="dl"><b><i>M</i></b> : 가스 또는 증기의 몰 질량 (kg/kmol)</div><div class="dl"><b><i>γ</i></b> : 단열 팽창 폴리트로픽 지수(단위없음)</div><div class="dl"><b><i>P</i></b> : 용기 내부의 압력 (Pa)</div><div class="dl"><b><i>P<sub>a</sub></i></b> : 대기압 (101,325 Pa)</div><div class="dl"><b><i>R</i></b> : 이상기체상수 (8314 J/kmol·K)</div><div class="dl"><b><i>S</i></b> : 유체가 누출되는 개구부(구멍)의 단면적 (m²)</div><div class="dl"><b><i>T</i></b> : 유체, 기체 또는 액체의 절대온도 (K)</div><div class="dl"><b><i>Z</i></b> : 압축인자(단위없음)</div>`,
 xb:`<div class="dl">여기서, <b><i>X<sub>b</sub></i></b> : 배경농도 (vol/vol)</div><div class="dl"><b><i>f</i></b> : 환기효율계수(단위없음), 실내의 평균 배경농도를 배기구측 농도로 나눈 값</div><div class="dl"><b><i>Q<sub>g</sub></i></b> : 누출원으로부터 누출되는 인화성 가스의 체적 유량 (m³/s)</div><div class="dl"><b><i>Q<sub>a</sub></i></b> : 공기의 체적 유량 (m³/s)</div><div class="dl"><b><i>X<sub>crit</sub></i></b> : 임계농도 (vol/vol), 일반적으로 LFL의 25 %</div>`,
 char:`<div class="dl">여기서, <b><i>W<sub>g</sub></i></b> : 가스 누출율 (kg/s)</div><div class="dl"><b><i>Q<sub>g</sub></i></b> : 부피 증발율 (m³/s)</div><div class="dl"><b><i>ρ<sub>g</sub></i></b> : 가스 또는 증기 밀도 (kg/m³)</div><div class="dl"><b><i>k</i></b> : LFL의 안전계수</div><div class="dl"><b>LFL</b> : 폭발 하한계 (vol/vol)</div>`
};
</script>
<script>
/* ===================== 계산서 렌더링 =====================
   블록(=논리적 한 덩어리)을 만들어 두고, 실제 높이를 재서 A4 한 장에
   들어가는 만큼 이어 붙인다. 블록마다 강제 페이지 나눔을 지정할 수 있다. */
let BLK=[];
/* head 는 그 블록이 페이지 맨 위로 올 때만 붙는 머리말(설비명 등) */
function page(inner,key,head){BLK.push({key:key||("b"+BLK.length),html:inner,head:head||"",alone:false})}
function pageAlone(inner,key){BLK.push({key:key||("b"+BLK.length),html:inner,head:"",alone:true})}
function matOf(s){return S.mats.find(m=>m.id===s.matId)||S.mats[0]}

const MMPX=96/25.4;                    // 1 mm 를 px 로
function mg(k,def){const v=+S.doc[k];return (isFinite(v)&&v>=0&&v<=60)?v:def}
function pageMargins(){return {t:mg("여백상",18),b:mg("여백하",14),l:mg("여백좌",15),r:mg("여백우",15)}}
/* 아래 다섯은 예전에 상수로 박혀 있었다. 한 장에 한 줄이 더 들어가느냐가
   이 값들에 걸리는 일이 많아 문서 설정으로 꺼냈다. */
function lay(k,def,lo,hi){const v=+S.doc[k];return isFinite(v)?Math.max(lo,Math.min(hi,v)):def}
function pnoMM(){return lay("쪽번호자리",9,0,20)}    // 쪽번호 자리 (본문 아래에서 떼어 둔다)
function safeMM(){return lay("여유",4,0,20)}         // 측정 오차 흡수용. 0 이면 1mm 차이로 장이 갈린다
function gapMM(){return lay("블록간격",6,0,30)}      // 한 장 안에서 블록 사이 간격
function lineH(){return lay("줄간격",1.6,1.2,2.2)}
function cellPad(){return Math.round(lay("표여백",3,0,8))}
const SPACE_MM=2;                      // 줄 여백 한 칸. 음수면 위로 당긴다
const SPACE_MIN=-6, SPACE_MAX=18;      // -12mm ~ +36mm
function contentMM(){const m=pageMargins();return 297-m.t-m.b}   // 인쇄영역 높이
function usableMM(){return Math.max(30,contentMM()-pnoMM())}     // 본문이 실제로 쓰는 높이
function budgetPx(){return Math.max(30,usableMM()-safeMM())*MMPX}
/* 화면 미리보기와 인쇄가 같은 지면을 쓰도록 여백을 한 곳에서 만들어 넣는다. */
function applyPageStyle(){
  const m=pageMargins(), el=$("#pgstyle"); if(!el)return;
  const lh=lineH(), cp=cellPad();
  el.textContent=
    `.page{padding:${m.t}mm ${m.r}mm ${m.b}mm ${m.l}mm;line-height:${lh}}`+
    /* 쪽번호는 본문 영역 맨 아래 가운데. 배치에서 그 자리를 미리 떼어놨으므로 겹치지 않는다 */
    `.page .pno{left:${m.l}mm;right:${m.r}mm;bottom:${m.b}mm}`+
    `.cover{min-height:${usableMM()-6}mm}`+
    /* 블록 사이 간격은 배치 계산과 실제 렌더가 반드시 같은 값을 써야 한다.
       장별로 다르게 준 경우는 그 장의 section 에 직접 얹는다 */
    `.blk+.blk{margin-top:${gapMM()}mm}`+
    /* 자체 줄간격을 가진 곳은 본문 줄간격에 비례해 따라간다 */
    `.calc{line-height:${(lh*1.1875).toFixed(3)}}`+
    `.dl,.sumbox .rgt{line-height:${(lh*1.0625).toFixed(3)}}`+
    /* 표는 글자보다 칸 여백이 높이를 지배한다 — 여기가 가장 크게 줄어든다 */
    `table.doc th,table.doc td{padding:${cp}px ${cp+1}px}`+
    `table.doc.tiny th,table.doc.tiny td{padding:${Math.max(0,cp-1)}px}`+
    `table.spec th,table.spec td{padding:${cp+1}px ${cp+3}px}`+
    /* 줄 조정 버튼은 오른쪽 여백 안에 들어앉힌다 */
    `.itctl{right:-${Math.max(m.r,15)}mm}`+
    `@media print{@page{size:A4;margin:0}}`;
}
/* 제목류는 뒤 내용과 떨어뜨리지 않는다(페이지 끝에 혼자 남지 않게) */
function isKeep(el){
  if(/^H[1-6]$/.test(el.tagName))return true;
  if(el.classList&&(el.classList.contains("item")||el.classList.contains("fm")))return true;
  if(el.tagName==="P"&&el.children.length===1&&el.firstElementChild.tagName==="B"
     &&el.textContent.trim()===el.firstElementChild.textContent.trim())return true;
  return false;
}

let PGKEYS=[];                         // 장마다 그 장을 여는 줄의 key (페이지 설정이 붙는 자리)
let _raf=null;
function renderReport(){               // 입력 중 과도한 재계산을 막기 위해 프레임 단위로 묶는다
  if(_raf)cancelAnimationFrame(_raf);
  _raf=requestAnimationFrame(()=>{_raf=null;buildReport()});
}
function buildReport(){
  applyPageStyle();                    // 측정 전에 지면 크기를 확정한다
  BLK=[];
  collectBlocks();
  const blocks=BLK;
  const brk=new Set(S.doc.breaks||[]);
  const sp=S.doc.spacers||{}, SPACE=SPACE_MM*MMPX;
  const spaceOf=k=>Math.max(SPACE_MIN,Math.min(SPACE_MAX,Math.round(+sp[k]||0)));

  /* 1) 측정 — 블록을 이루는 요소 하나하나의 높이를 잰다 */
  let mez=$("#measure");
  if(!mez){mez=document.createElement("section");mez.id="measure";mez.className="page";document.body.appendChild(mez)}
  mez.innerHTML=blocks.map(b=>`<div class="blk">${b.head}</div><div class="blk">${b.html}</div>`).join("");
  /* 출력과 같은 구조(.it 로 한 겹 감싼 상태)로 재야 형제 선택자·여백 겹침이 같게 걸린다 */
  const kids=mez.children;
  blocks.forEach((b,i)=>{
    const body=kids[2*i+1];
    Array.prototype.slice.call(body.children).forEach(c=>{
      const w=document.createElement("div");w.className="it";
      body.insertBefore(w,c);w.appendChild(c);
    });
  });
  const items=[];
  blocks.forEach((b,i)=>{
    const headH=kids[2*i].offsetHeight, body=kids[2*i+1];
    const box=body.getBoundingClientRect();
    const cs=Array.prototype.slice.call(body.children);
    if(!cs.length){items.push({b,headH,key:b.key+"#0",html:b.html,h:box.height,first:true,keep:false});return}
    const tops=cs.map(c=>c.getBoundingClientRect().top);
    cs.forEach((w,j)=>{
      let h=(j<cs.length-1?tops[j+1]:box.bottom)-tops[j];
      if(j===0)h+=tops[0]-box.top;
      const c=w.firstElementChild||w;
      items.push({b,headH,key:b.key+"#"+j,html:c.outerHTML,h,first:j===0,keep:isKeep(c)});
    });
  });
  mez.innerHTML="";
  items.forEach(it=>{it.space=spaceOf(it.key);it.h+=it.space*SPACE});

  /* 2) 한 장에 들어가는 만큼 채워 넣는다.
     장마다 다른 지면을 쓸 수 있다. 그 설정은 장 번호가 아니라 **그 장의 첫 줄**에
     매달아 둔다 — 번호에 매달면 위쪽에서 한 줄만 늘어도 남의 장 설정이 되어 버린다.
     여기서 바꿀 수 있는 값(위·아래 여백, 쪽번호 자리, 측정 여유, 블록 간격)은
     모두 본문 폭을 건드리지 않으므로, 이미 재 놓은 줄 높이를 그대로 쓸 수 있다. */
  const OV=S.doc.pageset||{}, M=pageMargins();
  const ovn=(o,k,def)=>{const v=o&&o[k];return (v!==""&&v!=null&&isFinite(+v))?+v:def};
  const budgetOf=first=>{
    const o=first?OV[first.key]:null;
    const t=ovn(o,"여백상",M.t), bm=ovn(o,"여백하",M.b), pno=ovn(o,"쪽번호자리",pnoMM());
    const use=Math.max(30,297-t-bm-pno);
    return {t,b:bm,full:use*MMPX,
            budget:Math.max(30,use-ovn(o,"여유",safeMM()))*MMPX,
            gap:ovn(o,"블록간격",gapMM())*MMPX};
  };
  const pages=[];let cur=[],curH=0,curKey=null,curSet=budgetOf(null);
  const KEEP_MAX=45*MMPX;              // 다음 장으로 함께 넘길 제목류의 최대 높이
  const startPage=seed=>{              // seed 를 얹은 채로 새 장을 시작하고 높이를 다시 센다
    cur=seed||[];curKey=null;curH=0;curSet=budgetOf(cur[0]||null);
    if(cur.length){
      curH=cur[0].headH;let prev=null;
      cur.forEach(c=>{if(prev!==null&&prev!==c.b.key)curH+=curSet.gap;curH+=c.h;prev=c.b.key});
      curKey=cur[cur.length-1].b.key;
    }
  };
  const flush=seed=>{if(cur.length)pages.push({items:cur,set:curSet});startPage(seed)};
  items.forEach(it=>{
    const b=it.b;
    // 줄 단위 강제 나눔 : 이 줄에 표시가 있거나, 블록 첫 줄에 블록 단위 표시가 있을 때
    it.forced = brk.has(it.key) || (it.first&&brk.has(b.key)) || (it.first&&b.alone);
    if(cur.length&&it.forced)flush();
    let gap=(cur.length&&curKey!==b.key)?curSet.gap:0;
    if(cur.length&&curH+gap+it.h>curSet.budget){
      /* 페이지 끝에 제목류만 남으면 다음 장으로 같이 넘긴다.
         넘긴 높이를 새 장에 바로 반영해야 그 장이 넘치지 않는다. */
      let k=cur.length,moveH=0;
      while(k>0&&cur[k-1].keep){moveH+=cur[k-1].h;k--}
      flush(k>0&&k<cur.length&&moveH<KEEP_MAX?cur.splice(k):null);
      gap=(cur.length&&curKey!==b.key)?curSet.gap:0;
    }
    /* 새 장의 첫 줄 — 이 줄이 그 장의 지면을 정한다 */
    if(!cur.length){curSet=budgetOf(it);gap=0;curH=it.headH}
    curH+=gap+it.h;cur.push(it);curKey=b.key;
    if(b.alone)flush();
  });
  flush();

  /* 3) 출력 — 같은 블록에서 온 연속 요소끼리 다시 묶는다 */
  let pn=0,h="";
  PGKEYS=[];
  pages.forEach(pg=>{
    const its=pg.items, st=pg.set, groups=[];
    its.forEach(it=>{
      const g=groups[groups.length-1];
      if(g&&g.b.key===it.b.key)g.items.push(it); else groups.push({b:it.b,items:[it]});
    });
    const tot=its.reduce((a,it)=>a+it.h,0)+groups[0].items[0].headH+(groups.length-1)*st.gap;
    const over=tot>st.full+1;
    pn++;
    const fk=its[0].key;                 // 이 장을 여는 줄 = 페이지 설정이 매달리는 자리
    PGKEYS.push(fk);
    const has=!!OV[fk], sel=S.selPageKey===fk;
    const pad=(st.t!==M.t||st.b!==M.b)?` style="padding-top:${st.t}mm;padding-bottom:${st.b}mm"`:"";
    h+=`<section class="page${over?" over":""}${has?" pgov":""}${sel?" pgsel":""}"${pad}>`
      +groups.map((g,gi)=>`<div class="blk">`
        +(gi===0?g.b.head:"")
        +g.items.map((it,ii)=>itemHtml(it,brk,gi===0&&ii===0)).join("")
        +`</div>`).join("")
      +`<div class="pno"${st.b!==M.b?` style="bottom:${st.b}mm"`:""}>- ${pn} -</div>`
      +`<button class="pgctl" data-act="pgset" data-k="${fk}"`
      +` title="${pn}쪽 — 이 장만 여백·간격을 따로 준다">⚙</button></section>`;
    if(over)pn+=Math.ceil(tot/st.full)-1;   // 한 장을 넘는 요소는 인쇄 시 여러 장이 된다
  });
  $("#report").innerHTML=h;
}
/* 줄 하나 = .it 한 칸. 오른쪽 여백의 ✂ 로 그 줄부터 새 페이지를 시작하고,
   ↑ ↓ 로 그 줄 위 여백을 SPACE_MM 만큼씩 당기거나 띄운다.
   당기기(음수)는 spacer 칸을 만들 수 없으므로 줄 자체를 위로 올린다. */
function itemHtml(it,brk,atTop){
  const on=brk.has(it.key)||(it.first&&brk.has(it.b.key));
  const k=brk.has(it.b.key)&&it.first?it.b.key:it.key;   // 예전 블록 단위 표시도 그대로 해제되게
  const sp=it.space||0, mm=sp*SPACE_MM, now=(mm>0?"+":"")+mm+"mm";
  return `<div class="it${on?" brk":""}${sp?" spaced":""}${atTop?" top":""}"`
    +(sp<0?` style="margin-top:${mm}mm"`:"")+`>`
    +(sp>0?`<div class="spc" style="height:${mm}mm"></div>`:"")
    +it.html
    +`<span class="itctl">`
    +`<button data-act="brk" data-k="${k}" class="${on?"on":""}"`
    +` title="${on?"이 줄의 페이지 나눔 해제":"이 줄부터 새 페이지에서 시작"}">${on?"⏏":"✂"}</button>`
    +`<button data-act="spc" data-k="${it.key}" data-d="-1" class="${sp<0?"on":""}"`
    +` title="이 줄 위를 ${SPACE_MM}mm 당깁니다 (현재 ${now})">↑</button>`
    +`<button data-act="spc" data-k="${it.key}" data-d="1" class="${sp>0?"on":""}"`
    +` title="이 줄 위를 ${SPACE_MM}mm 띄웁니다 (현재 ${now})">↓</button>`
    +`</span></div>`;
}

/* 환기형태(N/A/AG/AL) — 4.2 목록표 d) 주석과 설비별 표에 함께 실린다.
   "auto" 는 옥내=A, 옥외=N 이라는 통상적인 가정일 뿐이라, 자연환기 옥내처럼
   가정이 안 맞는 현장은 코드를 직접 골라 쓴다. */
const VENT_TYPES={auto:"위치 따라 자동(옥내 A / 옥외 N)",N:"N — 자연환기",A:"A — 강제환기",AG:"AG — 강제 전체환기",AL:"AL — 국소배기"};
function ventCode(s){
  const v=s.환기형태;
  return (v&&v!=="auto"&&VENT_TYPES[v]) ? v : (s.위치==="옥내"?"A":"N");
}

    const gr={"연속":"C","1차":"P","2차":"S"}[s.등급];
    const ut={"우수":"G","양호":"F","미흡":"P"}[r.이용도]||"P";
    const amt=r.mode==="liquid"&&s.poolMode==="tank"?`${num(r.Qg,3)}<br>(m³/s)`:num(r.mode==="liquid"?r.W:r.Wg,3);
    h+=`<tr><td>${i+1}</td><td>${esc(s.설비명)}</td><td>${esc(s.위치)}</td><td>${gr}</td><td>${amt}</td><td>${num(r.C,2)}</td>
    <td>${S.mats.indexOf(m)+1}</td><td>${s.Top==25?"AMB":s.Top}</td><td>${esc(popLabel(s))}</td>
    <td>${r.code}</td><td>${ventCode(s)}</td><td>${r.희석}</td><td>${ut}</td>
    <td>${r.zone}</td><td>${m1(r.수평)}</td><td>${m1(r.수직)}</td><td>${esc(s.비고)}</td></tr>`;});
  return h+`</table>`;
}

/* 배경농도를 고려하는 조건인지 아닌지에 대한 근거.
   비워 두면 고른 조건에 맞는 지침 문구를 자동으로 싣고, 적어 두면 적은 그대로 싣는다.
   국소배기장치 번호처럼 현장마다 다른 근거를 달아야 할 때가 있어 열어 둔다. */
function bgAuto(s){
  if(s.배경평가==="고려")
    return "옥내(밀폐공간)의 희석등급은 인화성 물질의 평균 배경농도 평가에 의하여 평가한다"
         + "(지침 <부록 2> 2.5 (4) 및 2.6.1 (3)). 배경농도와 비교되는 임계농도는 일반적으로 "
         + "LFL 의 25 % 로 한다(<부록 1> 3 (3)(가)).";
  return "제로 배경농도는 옥외 또는 누출원 주변에 인화성 물질의 이동을 제어하는 국소배기장치가 "
       + "있는 곳에서만 고려한다(지침 <부록 2> 2.6.1 (3)(다))."
       + (s.위치==="옥외"
          ? " 본 누출원은 옥외에 설치되어 제로 배경농도 조건에 해당하므로 배경농도를 고려하지 않는다."
          : " 본 누출원은 누출원 주변 국소배기장치로 인화성 물질의 이동이 제어되므로 제로 배경농도로 보고 배경농도를 고려하지 않는다.");
}
function bgText(s){
  const t=String(s.배경근거==null?"":s.배경근거).trim();
  return t||bgAuto(s);
}
function bgHint(s){
  return "계산서의 배경농도 항목에 근거로 실립니다. "
   + (String(s.배경근거||"").trim()
      ? "직접 고친 문구라 조건을 바꿔도 그대로 남습니다."
      : "아직 고치지 않아 고른 조건에 맞춰 계속 갱신됩니다.");
}
/* 농도는 vol/vol 로 계산하고, 읽기 쉽도록 vol% 를 괄호에 함께 적는다 */
function volTxt(x){return isFinite(x)?`${num(x,3)} vol/vol (${num(x*100,3)} vol%)`:"-"}
/* 계산서의 배경농도 블록. 고려하지 않는 조건이어도 그 근거는 남긴다. */
function bgBlock(s,m,r,cn){
  const 임계=`<i>X<sub>crit</sub></i> = 0.25 × ${trim((+m.LFL/100).toFixed(5))} = <span class="res">${volTxt(r.Xcrit)}</span>`;
  if(!r.배경){
    return `<p class="item">${cn} 배경농도 : <span class="orange">고려하지 않음(제로 배경농도)</span></p>
     <p class="ind" style="font-size:9.5pt">근거 : ${esc(bgText(s))}</p>
     <p class="ind" style="font-size:9.5pt">따라서 희석등급은 제로 배경농도를 바탕으로 작성된 희석등급 평가차트(지침 &lt;부록 2&gt; &lt;그림 1&gt;)로 판정한다.</p>`;
  }
  if(!r.배경ok){
    return `<p class="item">${cn} 배경농도 : <span class="orange">-</span></p>
     <p class="ind" style="font-size:9.5pt">근거 : ${esc(bgText(s))}</p>
     <p class="ind" style="font-size:9.5pt">공기 유량 <i>Q<sub>a</sub></i> 를 입력하면 배경농도가 계산됩니다.</p>`;
  }
  const 초과=r.Xb초과;
  return `<p class="item">${cn} 배경농도 <i>X<sub>b</sub></i> = <span class="orange">${volTxt(r.Xb)}</span></p>
   <p class="ind" style="font-size:9.5pt">근거 : ${esc(bgText(s))}</p>
   <p class="ind">⑴ 계산식</p>${EQ.xb}${DEF.xb}
   <p class="ind">⑵ 단계별 계산</p>
   <div class="calc">가. <i>Q<sub>a</sub></i> = ${num(r.Qa,4)} m³/s (= ${num(r.Qa*3600,4)} m³/h)${
     r.Qa역산!=null?` — 환기속도에서 역산 : <i>Q<sub>a</sub></i> = <i>u<sub>w</sub></i> × <i>L</i> × <i>B</i> = ${num(r.uw,3)} × ${num(+s.배경L,4)} × ${num(+s.배경B,4)} = ${num(r.Qa,4)} m³/s`:""
     }${r.V0?`, 대상체적 <i>V<sub>0</sub></i> = ${num(r.V0,4)} m³ → 공기교체주기 <i>C</i> = ${sci(r.C교환,3)} s⁻¹`:""}<br>
   &nbsp;&nbsp;&nbsp;&nbsp;<i>f</i> = ${r.f} (${esc(fTxt(r.f))})<br>
   &nbsp;&nbsp;&nbsp;&nbsp;<i>Q<sub>g</sub></i> = ${sci(r.Qg,3)} m³/s<br>
   <span class="arrow">→ <i>X<sub>b</sub></i> = ${r.f} × ${sci(r.Qg,3)} / ${num(r.Qa,4)} = <span class="res">${volTxt(r.Xb)}</span></span></div>
   ${r.Qa역산!=null?`<p class="ind2" style="font-size:9.5pt">공기 유량은 ④ 에서 정한 환기속도 <i>u<sub>w</sub></i> = ${num(r.uw,3)} m/s 와 단면 ${num(r.단면,4)} m² 로 역산한 값이다${String(s.uw근거||"").trim()?` — 환기속도 근거 : ${esc(s.uw근거)}`:""}.</p>`:""}
   <p class="ind">⑶ 임계농도와의 비교</p>
   <div class="calc">가. ${임계}<br>
   <span class="arrow">→ <i>X<sub>b</sub></i> ${초과?"&gt;":"≤"} <i>X<sub>crit</sub></i> 이므로 <span class="res">${초과?"희석등급 = 저희석":"희석등급 평가차트 적용 가능"}</span></span></div>
   <p class="ind2" style="font-size:9.5pt">${초과
     ? "밀폐공간에서의 배경농도가 임계농도보다 높으므로 희석등급은 <b>저희석</b>이며, 제로 배경농도를 바탕으로 작성된 희석등급 평가차트(지침 &lt;부록 2&gt; &lt;그림 1&gt;, 같은 부록 2.5 (1))를 이용한 평가절차는 필요하지 않다(&lt;부록 3&gt; 2.2.1 (2) 비고). 아래 차트는 평가를 확인하기 위한 참고자료이다."
     : "배경농도가 임계농도를 넘지 않으므로 희석등급은 희석등급 평가차트(지침 &lt;부록 2&gt; &lt;그림 1&gt;)로 판정한다."}</p>`;
}
/* 환기효율계수 f 는 값마다 뜻이 정해져 있다(<부록 2> 2.6.2 (2)(가)③) */
function fTxt(f){
  f=+f;
  if(f<=1)return "배경농도가 기본적으로 균일하고 배출구 농도가 평균 배경농도를 반영";
  if(f<=1.5)return "일부 비균질한 혼합";
  if(f<5)return "비균질한 혼합";
  return "많이 비균질한 혼합";
}

/* ※ 폭발위험지역의 추정 — 마지막 요약표 오른쪽 칸의 문구.
   비워 두면 계산 결과로 자동 작성하고, 입력해 두면 적은 그대로 싣는다.
   설비마다 현장 사정(구획·방류벽·인접설비 등)을 덧붙여야 할 때가 있어서 직접 쓸 수 있게 열어 둔다. */
function estAuto(s,r){
  return `환기유효성 ${r.희석}, 환기등급 ${r.이용도}으로 위험장소구분 기준으로 ${r.zone} 장소이며,\n`
       + `위험성을 고려하여 장치로부터 ${m1(r.수평)} m 를 ${r.zone} 장소로 구분함.`;
}
function estHint(s){
  return "계산서 마지막 요약표 오른쪽 칸에 그대로 실립니다. 줄바꿈도 그대로 반영됩니다. "
   + (String(s.추정문구||"").trim()
      ? "직접 고친 문구라 계산이 바뀌어도 그대로 남습니다."
      : "아직 고치지 않아 계산 결과에 맞춰 계속 갱신됩니다.");
}
function estHtml(s,r){
  const t=String(s.추정문구==null?"":s.추정문구).trim();
  return esc(t||estAuto(s,r)).replace(/\n/g,"<br>");
}

/* --------- 설비별 계산 페이지 --------- */
function srcPages(s,idx){
  const m=matOf(s), r=calcSrc(s,m);
  const liq=r.mode==="liquid", spill=liq&&s.poolMode==="spill";
  const hasHole = r.mode!=="given" && (!liq || spill);   // 제조사 데이터형은 오리피스가 없다
  let n=0; const N=()=>CIRC[n++];
  const title=`<h3 class="sub" style="margin-top:0">- ${esc(s.설비명)}${s.설명?`(${esc(s.설명)})`:""}</h3>`;
  const K=t=>"src:"+s.id+":"+t;
  /* 블록 A : 물질특성/환기조건 + 안전계수 + 환기속도 + 환기이용도 */
  page(`${idx===0?`<p style="font-size:10pt;margin-bottom:6px"><b>2) 폭발위험지역 계산결과</b></p>`:""}
   ${title}
   <p class="item">${N()} 물질특성 및 환기조건</p>
   <table class="spec"><tr><th colspan="2">Characteristics of release</th><th colspan="2">Ventilation characteristics</th></tr>
   <tr><td class="k">Material</td><td>${esc(m.명칭==="톨루엔"?"Toluene":m.명칭)}</td><td class="k">Location</td><td>${s.위치==="옥내"?"indoor":"outdoor"}</td></tr>
   <tr><td class="k">Phase</td><td>${r.code}</td><td class="k">Ventilation speed</td><td>${num(r.uw,3)} m/s</td></tr>
   <tr><td class="k">Molecular mass</td><td>${m.M} kg/kmol</td><td class="k">Ambient temperature</td><td>${s.Ta} ℃</td></tr>
   <tr><td class="k">Leakage<br>cross-sectional area</td><td>${trim((+s.S/1e6).toFixed(9))} m²</td><td class="k">Operating temperature</td><td>${s.Top} ℃</td></tr>
   <tr><td class="k">Source of release</td><td>${ph(s.누출원,"-")}<br><span style="font-size:8pt">(${esc(s.srcType)})</span></td><td class="k">Operating pressure</td><td>${esc(popLabel(s))}</td></tr>
   <tr><td class="k">Lower explosion limit(LEL)</td><td>${m.LFL} %</td><td class="k">Ventilation utilization<br>(G(우수), F(양호), P(미흡))</td><td>${({"우수":"G","양호":"F","미흡":"P"})[r.이용도]||"P"}</td></tr>
   <tr><td class="k">LEL Safety factor (k)</td><td>${s.k}<br><span style="font-size:8pt">(k=${s.k}: ${esc(s.k근거)})</span></td><td class="k">Ventilation type<br>(N(자연환기), A(강제환기))</td><td>${ventCode(s)}</td></tr>
   <tr><td class="k">누출계수(Cd)</td><td>${s.Cd}${String(s.Cd근거||"").trim()?`<br><span style="font-size:8pt">(${esc(s.Cd근거)})</span>`:""}</td><td class="k">누출등급</td><td>${s.등급}</td></tr></table>
   ${String(s.등급근거||"").trim()?`<p class="ind" style="font-size:9.5pt">누출등급 판정근거 : ${esc(s.등급근거)}</p>`:""}
   <p style="font-size:9.5pt;color:#1546a0;font-weight:700;margin-top:8px">∎ 안전 계수 결정 (K)</p>
   ${tblK(s.k,false,"doc")}
   <p class="item">${N()} 환기속도 : <span class="orange">${num(r.uw,3)} m/s</span></p>
   ${r.uw유도!=null
     ? `<div class="calc">가. <i>Q<sub>a</sub></i> = ${num(r.Qa,4)} m³/s<br>
        &nbsp;&nbsp;&nbsp;&nbsp;단면적 = <i>L</i> × <i>B</i> = ${num(+s.배경L,4)} × ${num(+s.배경B,4)} = ${num(r.단면,4)} m²<br>
        <span class="arrow">→ <i>u<sub>w</sub></i> = <i>Q<sub>a</sub></i> / (<i>L</i> × <i>B</i>) = ${num(r.Qa,4)} / ${num(r.단면,4)} = <span class="res">${num(r.uw,3)} m/s</span></span></div>
        <p style="font-size:9.5pt" class="ind">근거 : 옥내 환기속도는 공기유량을 기류에 수직인 단면적으로 나누어 산출한다(지침 &lt;부록 3&gt; 2.2.1 (2) 및 2.2.2 (2) 계산 예시).</p>`
     : `<figure><figcaption>&lt;표 1&gt; 옥외 환기속도(u<sub>w</sub>)</figcaption>${tblUwDoc(s.uw,s.uwcell,s.uw옥내)}</figure>
        ${String(s.uw근거||"").trim()?`<p style="font-size:9.5pt" class="ind">근거 : ${esc(s.uw근거)}</p>`:""}`}
   <p class="item">${N()} 환기이용도 : <span class="orange">${esc(s.이용도==="직접입력"?s.이용도직접:s.이용도)}</span></p>
   <p class="ind2" style="font-size:9.5pt">(${r.이용도} : ${({"우수":"환기가 실제적으로 지속되는 상태","양호":"환기의 정상작동이 지속됨이 예측되는 상태, 빈번하지 않는 단기간 중단은 허용된다.","미흡":"환기가 양호 또는 우수 기준을 충족하지 않지만, 장기간 중단이 예상되지 않는 상태"})[r.이용도]})</p>`,K("a"));
  /* 블록 B : 누출구멍 단면적.
     <표 1>은 지침 6.4(3) 에 따라 2차 누출등급 전용이다. 연속·1차는 통기구·브리더밸브 등
     실제 누출 오리피스의 형태와 크기로 정하므로 표를 싣지 않는다. */
  if(hasHole){
    const 이차=s.등급==="2차";
    page(`<p class="item">${N()} ${이차?"2차 누출등급에서의 ":""}누출 구멍 단면적 : <span class="orange">${s.S}mm²</span></p>
     ${이차
       ?`<figure><figcaption>&lt;표 1&gt; 2차누출등급의 누출구멍 단면적(권고)</figcaption>${tblHole(s.S,false,"doc tiny",s.Scell)}</figure>`
       :`<p class="ind2" style="font-size:9.5pt;color:#1546a0">* 지침에 따라 ${esc(s.등급)} 누출등급에서 누출구멍 크기는 누출 오리피스(예: 상대적으로 예측 가능한 조건하에서 가스가 누출되는 다양한 통기구와 브리더밸브 등)의 형태와 크기에 따라 정해진다. &lt;표 1&gt;은 2차 누출등급에만 적용되므로 인용하지 않는다.</p>`}
     ${String(s.S근거||"").trim()?`<p class="ind" style="font-size:9.5pt">적용근거 : ${esc(s.S근거)}</p>`:""}`,K("b"));
  }
  /* 블록 C : 누출률/증발률 */
  page(`${r.mode==="liquid"?liqCalc(s,m,r,N())
       : r.mode==="flash" ?flashCalc(s,m,r,N())
       : r.mode==="given" ?givenCalc(s,m,r,N())
       :                   gasCalc(s,m,r,N())}`,K("c"));
  /* 블록 C-2 : 배경농도. 순서도(본문 <그림 3>~<그림 5> 폭발위험장소 구분절차도)가 옥내는 희석등급 결정 앞에
     배경농도 평가를 두므로 누출률 다음, 희석등급 앞에 놓는다. */
  page(bgBlock(s,m,r,N()),K("cb"));
  /* 블록 D : 누출특성 + 희석등급 */
  const dilTxt = s.희석모드!=="auto"
    ? `희석등급 평가차트에 따라 ${r.희석auto}이지만, ${esc(s.희석근거||"설비특성상")} <span class="orange">${s.희석수동}</span>으로 판단함.`
    : r.희석배경
      ? `배경농도가 임계농도를 넘으므로 희석등급은 <span class="orange">저희석</span>이다.`
      : `희석등급 평가차트에 따라 <span class="orange">${r.희석}</span>으로 판단함.`;
  page(`<p class="item">${N()} 누출 특성 = <span class="orange">${num(r.C,2)} m³/s</span></p>
   <p class="ind">⑴ 계산식</p>${EQ.char}${DEF.char}
   <p class="ind">⑵ 단계별 계산</p>
   <div class="calc">가. <i>Q<sub>g</sub></i> = ${sci(r.Qg,3)}<br>
   &nbsp;&nbsp;&nbsp;&nbsp;<i>k</i> = ${s.k} (${esc(s.k근거)})<br>
   &nbsp;&nbsp;&nbsp;&nbsp;LFL = ${trim((m.LFL/100).toFixed(5))}<br>
   <span class="arrow">→ 누출특성 = ${sci(r.Qg,3)} / (${s.k} × ${trim((m.LFL/100).toFixed(5))}) = <span class="res">${num(r.C,2)} m³/s</span></span></div>
   <p class="item">${N()} ${dilTxt}</p>
   <figure>${chartDilution(r)}</figure>
   <p class="ind" style="font-size:9.5pt">판독 : 누출특성 ${num(r.C,2)} m³/s, 환기속도 ${num(r.uw,3)} m/s 교차점 → 고희석 경계선 u<sub>w</sub>=${num(r.bHi,3)} m/s, 저희석 경계선 u<sub>w</sub>=${num(r.bLo,3)} m/s</p>`,K("d"));
  /* 블록 E : 범위 */
  page(`<p class="item">${N()} 폭발위험지역 범위 추정차트에 따라 폭발위험지역 장소의 범위(반경)는 <span class="orange">${m1(r.범위)} m</span> 이다.</p>
   ${r.NE?`<div style="border:1px solid #c00;padding:6px 8px;font-size:9.5pt;color:#c00;margin-bottom:6px">
     ※ 판정 결과가 NE(무시할 수 있는 범위)이므로 지침 &lt;표 1&gt; 비고 a에 따라 정상조건에서 무시될 수 있는 이론적 폭발위험장소이다. 아래 차트는 참고용이다.</div>`:""}
   <figure>${chartExtent(r,s.누출형태)}</figure>
   <p class="ind" style="font-size:9.5pt">적용곡선 : ${s.누출형태} / 계산값 r = ${num(r.rShow,4)} m
   ${r.belowChart?` → 차트 하한(1 m) 미만이므로 보수적으로 <b>1 m</b> 적용`:""}</p>
   <p class="ind" style="font-size:9.5pt">수평범위 ${m1(r.수평)} m, 수직범위 ${m1(r.수직)} m 를 도면에 반영한다.</p>
   ${r.msg.length?`<div style="border-left:3px solid #e2620d;padding:4px 8px;font-size:9pt;margin-top:8px">${r.msg.map(x=>"※ "+x).join("<br>")}</div>`:""}`,K("e"));
  /* 블록 F : 종별 판정 */
  page(`<p class="item">${N()} 폭발위험장소의 종별 판정표에 따라 <span class="orange">${r.zone==="비위험"?"비위험 장소":r.zone+" 장소"}</span>이다.</p>
   <figure><figcaption>&lt;표 1&gt; 누출 등급 및 환기유효성에 따른 폭발위험장소 설정</figcaption>${tblZone(s.등급,r.희석,r.이용도,true)}</figure>
   <div class="sumbox"><div class="lft">
     <div>희석등급</div><div>${r.희석}</div>
     <div>가스종류</div><div>${+m.비중>=1?"무거운가스":"가벼운가스"}</div>
     <div>폭발위험장소 유형</div><div>${r.zone}</div>
     <div>기기 그룹 및 온도 등급</div><div>${esc(m.그룹)} ${esc(m.온도)}</div>
     <div>계산거리(반경)</div><div>${m1(r.범위)} m</div>
   </div><div class="rgt">※ 폭발위험지역의 추정<br>
     ${estHtml(s,r)}</div></div>`,K("f"));
}
/* ΔP 산정 과정 — 액체 오리피스식을 쓰는 유형(액체·액화가스)이 함께 쓴다 */
/* 입력한 운전압력을 게이지압으로 바꾸는 한 줄. 절대로 넣었으면 대기압을 빼는 과정을 보인다. */
function pgLine(s,r){
  return s.PopBasis==="a"
    ? `${esc(popLabel(s))} = ${Math.round(r.Pabs).toLocaleString()} Pa(절대) − 대기압 101,325 Pa = ${Math.round(r.Pg).toLocaleString()} Pa`
    : `${esc(popLabel(s))} = ${Math.round(r.Pg).toLocaleString()} Pa`;
}
/* 두 항을 적어 놓은 줄의 오른쪽 끝. 부압이면 적힌 두 수의 합(음수)을 그대로 보인다.
   ΔP 가 음수라는 것은 개구부 안쪽이 대기압보다 낮다는 뜻 — 액체가 밀려나가는 대신
   외기가 빨려 들어가므로 이 개구부는 액체 누출원이 아니고 W = 0 이다.
   (계산은 √ 안에 음수를 넣을 수 없어 ΔP 를 0 으로 두지만, 그건 내부 처리일 뿐이므로 적지 않는다) */
function dpSumTail(r){
  if(!r.dPneg)return `${r.dPshow.toLocaleString()} Pa`;
  const sum=Math.round(r.Pg)+Math.round(r.dPhead);
  return `${sum.toLocaleString()} Pa &lt; 0 → 개구부 안쪽이 대기압보다 낮아 액체가 유출되지 않는다(외기 유입) : <i>W</i> = 0`;
}
function dpLines(s,m,r){
  if(s.dPmode!=="head")
    /* ΔP 를 직접 적용한 경우. h 는 그 압력에 상당하는 액주높이를 역산한 값 */
    return `Δ<i>P</i> = ${r.dPshow.toLocaleString()} Pa 를 적용함<br>
  &nbsp;&nbsp;&nbsp;<i>h</i> = <span class="frac"><span>Δ<i>P</i></span><span class="den"><i>ρ</i> × <i>g</i></span></span> = ${r.dPshow.toLocaleString()} / (${m.rho} kg/m³ × 9.8 m/sec²) = ${fx(r.hEq,2)} m &nbsp;(상당 액주높이)`;
  if(r.isATM)
    /* 상압(게이지 0) — 액주만 남는다 */
    return `Δ<i>P</i> = <i>ρ</i> × <i>g</i> × <i>h</i> (운전압력 상압, <i>h</i> = ${s.h} m 로 가정함)<br>
  &nbsp;&nbsp;&nbsp;= ${m.rho} kg/m³ × 9.8 m/sec² × ${s.h} m = ${fx(r.dP,2)} kg/(m·s²) ≈ ${r.dPshow.toLocaleString()} Pa`;
  if(!r.ty.head||!(r.dPhead>0))
    /* 펌프 토출처럼 액주를 세지 않는 경우 — 게이지 운전압력이 곧 ΔP */
    return `Δ<i>P</i> = <i>P</i><sub>g</sub> <span style="font-size:8.5pt">(게이지 운전압력)</span><br>
  &nbsp;&nbsp;&nbsp;= ${pgLine(s,r)}`;
  /* 가압 — 게이지 운전압력이 액주에 더해진다 */
  return `Δ<i>P</i> = <i>P</i><sub>g</sub> + <i>ρ</i> × <i>g</i> × <i>h</i> &nbsp;<span style="font-size:8.5pt">(<i>P</i><sub>g</sub> = 게이지 운전압력, <i>h</i> = ${(+s.h||0)} m)</span><br>
  &nbsp;&nbsp;&nbsp;<i>P</i><sub>g</sub> = ${pgLine(s,r)}<br>
  &nbsp;&nbsp;&nbsp;<i>ρgh</i> = ${m.rho} kg/m³ × 9.8 m/sec² × ${(+s.h||0)} m = ${Math.round(r.dPhead).toLocaleString()} Pa<br>
  &nbsp;&nbsp;&nbsp;∴ Δ<i>P</i> = ${Math.round(r.Pg).toLocaleString()} + ${Math.round(r.dPhead).toLocaleString()} = ${dpSumTail(r)}
`;
}

/* 가압 액화가스 — 액체 오리피스로 W 를 구한 뒤 플래시분율만 증기가 된다.
   지침 <부록 3> 2.2.1 (1) 이 Wg 를 "누출 지점에서 증기화된 액체비율"로 잡은 것과 같은 방식. */
function flashCalc(s,m,r,cn){
  const S6=trim((+s.S/1e6).toFixed(9));
  return `<p class="item">${cn} 가스 누출률(<i>W<sub>g</sub></i>) = <span class="orange">${num(r.Wg,3)} kg/s</span></p>
  <p class="ind2" style="color:#1546a0;font-size:9.5pt">* 지침 6.3.3 : 가압된 액화가스는 누출점에서 부분적으로 플래시 증발하며, 유체가 냉각되어 전체가 증발되지는 않는다.
   따라서 액체 누출률 <i>W</i> 를 (식1)로 구한 뒤 증기화된 액체비율만 증기운에 기여한다 — 지침 &lt;부록 3&gt; 2.2.1 (1)이 <i>W<sub>g</sub></i> 를 <i>W</i> 의 2 %로 잡은 것과 같은 방식이다.</p>
  <p class="ind">⑴ 액체 누출률</p>${EQ.liq}${DEF.liq}
  <div class="calc">
  ${dpLines(s,m,r)}<br>
  ∴ <i>W</i> = ${s.Cd} × ${S6} × √(2 × ${m.rho} × ${r.dPshow}) = <span class="res">${num(r.W,4)} kg/s</span></div>
  <p class="ind">⑵ 플래시 증발분율 적용</p>
  <div class="dl"><b><i>F<sub>v</sub></i></b> : 누출 지점에서 증기화된 액체비율${String(s.Fv근거||"").trim()?` — ${esc(s.Fv근거)}`:""}</div>
  <div class="calc"><i>W<sub>g</sub></i> = <i>W</i> × <i>F<sub>v</sub></i> = ${num(r.W,4)} × ${trim(String(+s.Fv))}% = <span class="res">${num(r.Wg,3)} kg/s</span><br>
  <span style="font-size:8.5pt">남은 액체 ${trim(String(100-(+s.Fv)))}% 는 지침 예제와 같이 배출되는 것으로 보아 풀을 형성하지 않는 것으로 산정함.</span></div>
  <p class="ind">⑶ 가스(증기) 밀도</p>
  <div class="calc"><i>ρ<sub>g</sub></i> = <span class="frac"><span><i>P<sub>a</sub></i> × <i>M</i></span><span class="den"><i>R</i> × <i>T<sub>a</sub></i></span></span>
   = (101,325 × ${m.M}) / (8314 × ${fx(r.Ta,2)}) = <span class="res">${num(r.rho_g,4)} kg/m³</span><br>
  &nbsp;&nbsp;<i>Q<sub>g</sub></i> = <i>W<sub>g</sub></i> / <i>ρ<sub>g</sub></i> = <span class="res">${sci(r.Qg,3)} m³/s</span></div>`;
}

/* 브리더밸브 등 — 제조사가 제시한 누출률을 그대로 쓴다 */
function givenCalc(s,m,r,cn){
  return `<p class="item">${cn} 누출률(<i>W<sub>g</sub></i>) = <span class="orange">${num(r.Wg,3)} kg/s</span></p>
  <p class="ind2" style="color:#1546a0;font-size:9.5pt">* 지침 &lt;부록 3&gt; 2.2.1 (3) 브리더밸브 예시는 누출률을 오리피스식으로 계산하지 않고 <b>제조사 데이터</b>로 제시한다
   (1차 4.50×10⁻³ kg/s, 2차 4.95×10⁻² kg/s). 따라서 <i>C<sub>d</sub></i>·<i>S</i>·Δ<i>P</i> 를 쓰지 않는다.</p>
  <p class="ind">⑴ 적용 누출률</p>
  <div class="calc"><i>W<sub>g</sub></i> = <span class="res">${num(r.Wg,3)} kg/s</span> &nbsp;<span style="font-size:8.5pt">(${esc(String(s.S근거||"제조사 데이터"))})</span></div>
  <p class="ind">⑵ 가스(증기) 밀도</p>
  <div class="calc"><i>ρ<sub>g</sub></i> = <span class="frac"><span><i>P<sub>a</sub></i> × <i>M</i></span><span class="den"><i>R</i> × <i>T<sub>a</sub></i></span></span>
   = (101,325 × ${m.M}) / (8314 × ${fx(r.Ta,2)}) = <span class="res">${num(r.rho_g,4)} kg/m³</span><br>
  &nbsp;&nbsp;<i>Q<sub>g</sub></i> = <i>W<sub>g</sub></i> / <i>ρ<sub>g</sub></i> = <span class="res">${sci(r.Qg,3)} m³/s</span></div>`;
}

function liqCalc(s,m,r,cn){
  const spill=s.poolMode==="spill";
  const S6=trim((+s.S/1e6).toFixed(9));
  return `<p class="item">${cn} 액체 부피 증발률(<i>Q<sub>g</sub></i>) = <span class="orange">${sci(r.Qg,3)} m³/s</span></p>
  <p class="ind">⑴ 계산식</p>${EQ.pool}${DEF.pool}
  <p class="ind">⑵ 단계별 계산</p>
  <p class="ind2"><b>가. 풀 표면적(<i>A<sub>p</sub></i>)</b></p>
  ${spill?`<p class="ind2" style="color:#1546a0;font-size:9.5pt">* 지침 : 용기에서 흘러나오는 액체는 즉시 1cm 깊이의 풀(Pool)로써 평평한 표면을 형성하고 대기 조건에서 증발된다고 가정.</p>
  ${EQ.ap}
  <div class="dl">여기서, <b><i>W</i></b> : 액체의 누출율 (kg/s)</div>
  <div class="dl"><b><i>t</i></b> : 누출시간 (${s.t}s) — KOSHA GUIDE P-107-2020를 참고하여 가장 보수적으로 누출시간을 적용함.</div>
  <div class="dl"><b><i>C<sub>d</sub></i></b> : 누출계수 (단위 없음), 일반적으로 모난 오리피스는 0.5~0.75 (여기서는 ${s.Cd}로 가정)</div>
  <div class="dl"><b><i>S</i></b> : 유체가 누출되는 개구부(구멍)의 단면적 (m²)</div>
  <div class="dl"><b><i>ρ</i></b> : 액체 밀도 (kg/m³)</div>
  <div class="dl"><b>Δ<i>P</i></b> : 개구부에서의 누설 압력 차 (Pa)</div>
  <div class="calc">
  ${dpLines(s,m,r)}<br>
  ∴ <i>W</i> = ${s.Cd} × ${S6} × √(2 × ${m.rho} × ${r.dPshow}) = <span class="res">${num(r.W,4)} kg/s</span><br>
  &nbsp;&nbsp;<i>V</i><sub>누출</sub> = ${num(r.W,4)} × ${s.t} / ${m.rho} = <span class="res">${num(r.V,4)} m³</span><br>
  &nbsp;&nbsp;<i>A<sub>p</sub></i> = ${num(r.V,4)} / 0.01 = <span class="res">${num(r.Ap,4)} m²</span></div>`
  :`<p class="ind2" style="color:#1546a0;font-size:9.5pt">* 탱크에 저장된 물질의 액표면 면적(탱크 단면적) 적용 — 대기와 연결된 통기구가 설치된 고정지붕 탱크 내부의 인화성 액체 표면</p>
  <div class="calc"><i>A<sub>p</sub></i> = <span class="frac"><span>π × ${s.D}²</span><span class="den">4</span></span> = <span class="res">${num(r.Ap,4)} m²</span> &nbsp;(탱크 내경 D = ${s.D} m)</div>`}
  <div class="calc" style="margin-top:8px">
  <span class="arrow">→ <i>Q<sub>g</sub></i> = <span class="frac"><span>6.5 × ${num(r.uw,3)}<sup>0.78</sup> × ${num(r.Ap,4)} × ${m.Pv}</span><span class="den">10<sup>5</sup> × ${m.M}<sup>0.333</sup></span></span>
   × <span class="frac"><span>${fx(r.Ta,2)}</span><span class="den">${fx(r.Top,2)}</span></span> = <span class="res">${sci(r.Qg,3)} m³/s</span></span></div>
`;
}
function gasCalc(s,m,r,cn){
  const S6=trim((+s.S/1e6).toFixed(9));
  return `<p class="item">${cn} 가스 누출률(<i>W<sub>g</sub></i>) = <span class="orange">${num(r.Wg,3)} kg/s</span></p>
  <p class="ind">⑴ 용기 내부압력(절대압) 환산</p>
  <p class="ind2" style="color:#1546a0;font-size:9.5pt">* 지침 기호표 : <i>P</i> 는 "용기의 내부압력"이므로 <b>절대압</b>을 적용한다.
   절대압은 게이지압에 대기압을 더한 값이다 — <b>절대 = 게이지 + 101,325 Pa</b>.</p>
  <div class="calc"><i>P</i> = ${r.isATM
    ? `대기압(상압) = <span class="res">101,325 Pa(abs)</span>`
    : (s.PopBasis==="a"
      ? `${esc(popLabel(s))} — 이미 절대압으로 입력됨 = <span class="res">${Math.round(r.Pabs).toLocaleString()} Pa(abs)</span>`
      : `${esc(popLabel(s))} = ${Math.round(r.Pg).toLocaleString()} Pa(gauge) + 101,325 Pa = <span class="res">${Math.round(r.Pabs).toLocaleString()} Pa(abs)</span>`)}</div>
  <p class="ind">⑵ 임계압력 판정</p>${EQ.pc}
  <div class="calc"><i>P<sub>C</sub></i> = 101,325 × [(${m.gamma}+1)/2]<sup>${m.gamma}/(${m.gamma}−1)</sup> = <span class="res">${Math.round(r.Pc).toLocaleString()} Pa</span><br>
  용기 내부압력 <i>P</i> = ${Math.round(r.P).toLocaleString()} Pa ${r.choked?"≥":"&lt;"} <i>P<sub>C</sub></i> → <span class="res">${r.choked?"음속누설(Chocked)":"아음속누설(Non chocked)"}</span></div>
  <p class="ind">⑶ 가스 누출률</p>${r.choked?EQ.choked:EQ.nonchoked}${DEF.gas}
  <div class="calc">∴ <i>W<sub>g</sub></i> = ${s.Cd} × ${S6} × ${Math.round(r.P).toLocaleString()} × √(…) = <span class="res">${num(r.Wg,3)} kg/s</span>
  &nbsp;<span style="font-size:8.5pt">(M=${m.M}, γ=${m.gamma}, T=${s.T_gas}K, Z=${r.Z}, R=8314)</span></div>
  <p class="ind">⑷ 가스(증기) 밀도</p>
  <div class="calc"><i>ρ<sub>g</sub></i> = <span class="frac"><span><i>P<sub>a</sub></i> × <i>M</i></span><span class="den"><i>R</i> × <i>T<sub>a</sub></i></span></span>
   = (101,325 × ${m.M}) / (8314 × ${fx(r.Ta,2)}) = <span class="res">${num(r.rho_g,4)} kg/m³</span><br>
  &nbsp;&nbsp;<i>Q<sub>g</sub></i> = <i>W<sub>g</sub></i> / <i>ρ<sub>g</sub></i> = <span class="res">${sci(r.Qg,3)} m³/s</span></div>`;
}
</script>
<script>
/* ===================== 입력 패널 ===================== */
function F(label,path,type,attrs){
  const v=getPath(path);
  return `<label class="f"><span>${label}</span><input type="${type||"text"}" data-path="${path}" ${type==="number"?'step="any"':""} value="${v==null?"":String(v).replace(/"/g,"&quot;")}" ${attrs||""}></label>`;
}
/* 운전압력 : 숫자 + 단위 + 게이지/절대. 단위에서 "상압"을 고르면 숫자칸은 잠긴다. */
function popField(s){
  /* 유형은 기본값만 정해 줄 뿐 잠그지 않는다. 상압탱크로 두고도 압력을 넣을 수 있어야 한다.
     숫자·기준칸만 "상압" 단위일 때 비활성인데, 이는 상압에 넣을 숫자가 없기 때문이다. */
  const u=s.PopUnit||"상압", atm=P_UNITS[u]==null;
  /* 세 컨트롤을 그리드로 나눈다. label.f>span 의 display:block 을 이겨야 하므로 인라인으로 준다. */
  return `<label class="f"><span>운전압력</span><span style="display:grid;grid-template-columns:1.1fr 1fr 0.9fr;gap:4px">

/* 숫자칸은 포커스를 지키려고 패널을 다시 그리지 않는다. 그래서 압력·ΔP 해설은
   따로 떼어 두고 syncSide() 에서 그 상자만 갈아 끼운다. 안 그러면 값이 멈춰 보인다. */
function popHintHtml(s,m,r){
  const liq=r.mode==="liquid", flash=r.mode==="flash", given=r.mode==="given";
  const hint = r.isATM
    ? `상압(게이지 0)입니다. ${given?"누출률은 제조사 데이터를 쓰므로 이 값은 목록표 표기에만 씁니다."
       :(liq||flash)?"액체 Δ<i>P</i> 는 액주 <i>ρgh</i> 만으로 산정됩니다.":"가스는 구동 압력차가 없어 <b>W<sub>g</sub> = 0</b> 입니다."}`
    : r.popOk
      /* 두 값을 나란히만 두면 관계가 안 보인다. 더하기를 그대로 보여 준다. */
      ? `게이지 <b>${Math.round(r.Pg).toLocaleString()}</b> + 대기압 101,325 = 절대 <b>${Math.round(r.Pabs).toLocaleString()} Pa</b>${given?` — 목록표 표기용(계산에는 쓰이지 않음)`:""}`
      : `숫자를 입력하세요.`;
  /* 상압탱크에 미압이 걸려 있다고 해서 유형이 틀린 것은 아니다. 고정지붕 상압탱크는
     브리더밸브 설정압만큼 미압을 달고 운전한다(API 650 은 약 2.5 kPa 까지 상압탱크로 본다).
     유형은 ΔP 를 어떻게 조합할지 정할 뿐이고, 넣은 압력은 어느 유형에서든 그대로 반영된다. */
  return `<p class="hint">${hint}</p>`;
}
/* 액체·액화가스의 ΔP 해설 (누출 조건 칸) */
function dpHintHtml(s,r){
  /* 압력을 아직 안 넣었으면 NaN 을 늘어놓지 말고 무엇이 빠졌는지만 알린다 */
  if(s.dPmode==="head"&&!r.popOk)return `<p class="hint">운전압력을 입력하면 ΔP 가 계산됩니다.</p>`;
  const head = s.dPmode!=="head"
    ? `ΔP = ${num(r.dP,5)} Pa <em>(직접입력)</em>`
    : r.isATM
      ? `ΔP = ρ·g·h = ${num(r.dP,5)} Pa <em>(운전압력 상압)</em>`
      : `ΔP = P<sub>게이지</sub> + ρ·g·h = ${Math.round(r.Pg).toLocaleString()} + ${Math.round(r.dPhead).toLocaleString()} = <b>${dpSumTail(r)}</b>`;
  return `<p class="hint">${head}</p>`;
}
